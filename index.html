<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>午托点名</title>
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="午托点名">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#F6F5F2;
  --card:#FFFFFF;
  --card-2:#FBFAF8;
  --line:#E7E4DE;
  --line-2:#EFEDE8;
  --text:#1F2320;
  --muted:#7C8179;
  --muted-2:#9AA098;
  --accent:#2E8B57;
  --shadow:0 1px 2px rgba(31,35,32,.05), 0 6px 16px rgba(31,35,32,.055);
  --shadow-s:0 1px 2px rgba(31,35,32,.06);
  --r:16px;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  /* 状态色 */
  --s-dao:#22C55E;
  --s-late:#F59E0B;
  --s-leave:#0EA5E9;
  --s-absent:#D9534F;
  --s-duty:#8B5CF6;
  --row-a:#FFE58F;
  --row-b:#BFE9FF;
  --dur:150ms;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181A;
    --card:#232528;
    --card-2:#1D1F22;
    --line:#33363A;
    --line-2:#2B2E31;
    --text:#ECEDEE;
    --muted:#9BA1A6;
    --muted-2:#7E848A;
    --accent:#3FA36B;
    --row-a:#3A3116;
    --row-b:#17303D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.35);
    --shadow-s:0 1px 2px rgba(0,0,0,.35);
  }
}

/* ============ 基础 ============ */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font:400 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;                 /* 只有 .main 内部滚动，避免整页横向漂移 */
  touch-action:manipulation;       /* 禁双击缩放 */
  -webkit-user-select:none; user-select:none;
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; touch-action:manipulation;}
input,textarea{font:inherit; color:inherit; -webkit-user-select:text; user-select:text;}
input[type=date]{-webkit-appearance:none; appearance:none;}

/* ============ 骨架 ============ */
.app{display:flex; flex-direction:column; height:100%; height:100dvh; overflow:hidden;}

/* 顶部 */
.hd{
  flex:0 0 auto; background:var(--bg);
  padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 12px) 0 calc(var(--safe-l) + 12px);
  border-bottom:1px solid var(--line-2);
}
.datebar{display:flex; align-items:center; gap:8px; height:44px;}
/* v1.5 模式切换：日期栏下方的二段切换，午托 / 培训各一套底部导航 */
.modeswitch{
  display:flex; gap:4px; background:var(--line-2); padding:3px; border-radius:11px;
  margin:8px 0 2px;
}
.modeswitch button{
  flex:1 1 0; height:32px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted);
}
.modeswitch button.on{background:var(--card); color:var(--text); box-shadow:var(--shadow-s);}
.dnav{
  width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center;
  border-radius:12px; color:var(--muted); font-size:20px; line-height:1;
}
.dnav:active{background:var(--line-2);}
.dlabel{
  flex:1 1 auto; min-width:0; height:44px; display:flex; align-items:center; justify-content:center; gap:6px;
  font-weight:600; font-size:17px; letter-spacing:.2px; border-radius:12px; position:relative;
}
.dlabel:active{background:var(--line-2);}
.dlabel .today{font-size:11px; font-weight:600; color:var(--accent); background:rgba(46,139,87,.1); padding:2px 6px; border-radius:6px;}
.dlabel input[type=date]{
  position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0;
}
/* 状态栏：固定在头部，学生列表滚动时始终可见 */
.brush{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:2px 0 8px;}
.brush button{
  height:46px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:15px; font-weight:600; color:var(--text);
  transition:background var(--dur) ease, border-color var(--dur) ease, transform 120ms ease;
}
.brush button:active{transform:scale(.97);}
.brush button i{width:9px; height:9px; border-radius:50%; display:block;}
.brush button.on{color:#101613; border-color:transparent;}
.brush button.on[data-k=dao]{background:var(--s-dao);}
.brush button.on[data-k=leave]{background:var(--s-leave);}
.brush button.on[data-k=duty]{background:var(--s-duty);}
.brush button.on i{background:#fff !important;}
/* 进度 */
.prog{display:flex; align-items:center; gap:10px; padding:0 2px 8px;}
.prog b{font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap;}
.prog .bar{flex:1 1 auto; height:4px; border-radius:2px; background:var(--line); overflow:hidden;}
.prog .bar i{display:block; height:100%; width:0%; background:var(--accent); border-radius:2px; transition:width var(--dur) ease;}

/* 主体滚动区 */
.main{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding:0 calc(var(--safe-r) + 12px) 12px calc(var(--safe-l) + 12px);
  overscroll-behavior:contain;
}
/* 工具条：搜索 + 筛选 */
.search{margin:10px 0 8px;}
.search input{
  width:100%; height:40px; border-radius:12px; border:1px solid var(--line);
  background:var(--card); padding:0 12px 0 34px; font-size:14px; outline:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='%239AA098' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M16.5 16.5 21 21'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:12px 50%;
}
.filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin:0 -12px; padding-left:12px; padding-right:12px;}
.filters::-webkit-scrollbar{display:none;}
.fchip{
  flex:0 0 auto; height:30px; padding:0 11px; border-radius:15px; background:var(--card);
  border:1px solid var(--line); font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:5px;
}
.fchip .cnt{font-size:11px; color:var(--muted-2); font-variant-numeric:tabular-nums;}
.fchip.on{background:var(--text); border-color:var(--text); color:var(--bg);}
.fchip.on .cnt{color:rgba(255,255,255,.72);}
@media (prefers-color-scheme: dark){ .fchip.on .cnt{color:rgba(0,0,0,.5);} }

/* 学生网格（v1.1：2 列大名片，点名页不再渲染头像圆） */
.grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
/* 行斑马纹：两列一行，单数行暖黄 / 双数行浅蓝 */
.grid .card:nth-child(4n+1), .grid .card:nth-child(4n+2){--row-bg:var(--row-a);}
.grid .card:nth-child(4n+3), .grid .card:nth-child(4n+4){--row-bg:var(--row-b);}
.card{
  position:relative; background:var(--row-bg, var(--card)); border-radius:var(--r); border:1px solid var(--line-2);
  padding:20px 10px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  text-align:center;
  box-shadow:var(--shadow-s); transition:transform 130ms ease, box-shadow 130ms ease, background 130ms ease, border-color 130ms ease;
  min-height:108px; overflow:hidden;
}
.card:active{transform:scale(.965);}
.card .dot{position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--line);}
/* 主显示名：>=22px / 700 / 单行不截断 */
.card .nm{
  font-size:22px; font-weight:700; line-height:1.2; letter-spacing:.3px; max-width:100%;
  white-space:nowrap;
}
/* 名字下方一行班级小字：12px / muted / 可截断不换行 */
.card .gp{
  font-size:12px; color:var(--muted); line-height:1.3; max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;
}
/* 选中态：边框色 + 淡底 + 左上角文字标签，三通道（不再依赖头像环） */
.card.st-dao{background:color-mix(in srgb, var(--s-dao) 45%, var(--row-bg)); border-color:var(--s-dao);}
.card.st-dao .dot{background:var(--s-dao);}
.card.st-leave{background:color-mix(in srgb, var(--s-leave) 45%, var(--row-bg)); border-color:var(--s-leave);}
.card.st-leave .dot{background:var(--s-leave);}
.card.st-duty{background:color-mix(in srgb, var(--s-duty) 45%, var(--row-bg)); border-color:var(--s-duty);}
.card.st-duty .dot{background:var(--s-duty);}
/* 状态文字徽标（不靠颜色单独区分） */
.card .tag{
  position:absolute; left:6px; top:6px; font-size:9px; font-weight:700; line-height:1;
  padding:3px 4px; border-radius:5px; color:#101613; display:none;
}
.card[data-st]:not([data-st=""]) .tag{display:block;}
.card[data-st=dao] .tag{background:var(--s-dao);}
.card[data-st=leave] .tag{background:var(--s-leave);}
.card[data-st=duty] .tag{background:var(--s-duty);}

/* 空状态 */
.empty{
  text-align:center; color:var(--muted); padding:56px 20px; font-size:14px; line-height:1.7;
}
.empty .big{font-size:15px; font-weight:600; color:var(--text); margin-bottom:6px;}
.empty button{
  margin-top:14px; height:44px; padding:0 20px; border-radius:12px; background:var(--text); color:var(--bg);
  font-weight:600; font-size:14px;
}

/* 底部 */
.bottom{flex:0 0 auto; background:var(--bg); border-top:1px solid var(--line-2);}
.stats{
  display:flex; align-items:center; gap:2px; padding:6px calc(var(--safe-r) + 8px) 6px calc(var(--safe-l) + 8px);
}
.st{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0;}
.st .n{font-size:14px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;}
.st .l{font-size:10px; color:var(--muted-2); line-height:1; display:flex; align-items:center; gap:3px; white-space:nowrap;}
.st .l i{width:6px; height:6px; border-radius:50%; display:block;}
.st.total .n{color:var(--text);}
.undo{
  flex:0 0 auto; height:36px; padding:0 11px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); font-size:12px; font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:4px;
  min-width:64px; justify-content:center;
}
.undo[disabled]{opacity:.4;}
.undo:active:not([disabled]){transform:scale(.96);}
.undo b{font-size:11px; color:var(--muted-2); font-weight:600;}

.tabbar{
  display:flex; align-items:stretch; height:52px;
  padding:0 calc(var(--safe-r) + 4px) calc(var(--safe-b) + 0px) calc(var(--safe-l) + 4px);
}
.tab{
  flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--muted-2); font-size:10px; font-weight:500; padding-top:4px;
}
.tab svg{width:22px; height:22px; display:block;}
.tab.on{color:var(--text);}
.tab.on .ico{transform:translateY(-1px);}
.tab .ico{transition:transform var(--dur) ease;}

/* 底部弹层 */
.mask{
  position:fixed; inset:0; background:rgba(20,22,20,.38); z-index:40;
  opacity:0; pointer-events:none; transition:opacity 170ms ease;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.mask.on{opacity:1; pointer-events:auto;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--card);
  border-radius:20px 20px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.18);
  transform:translateY(102%); transition:transform 180ms cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(var(--safe-b) + 10px);
  max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0);}
.sheet .grab{width:36px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 2px;}
.sheet .sh-hd{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 16px 6px;
}
.sheet .sh-hd h3{margin:0; font-size:16px; font-weight:600;}
.sheet .sh-hd .x{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--muted); font-size:18px;}
.sheet .sh-bd{padding:6px 16px 8px;}
.sheet .sh-ft{display:flex; gap:8px; padding:8px 16px 4px;}
.btn{
  flex:1 1 0; height:46px; border-radius:13px; background:var(--card-2); border:1px solid var(--line);
  font-size:15px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active{transform:scale(.985);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.danger{color:var(--s-absent); border-color:color-mix(in srgb, var(--s-absent) 34%, var(--line));}
.btn.ghost{background:none;}
.btn[disabled]{opacity:.45;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
.field input[type=text], .field input[type=number], .field textarea{
  width:100%; border-radius:11px; border:1px solid var(--line); background:var(--card-2);
  padding:11px 12px; font-size:15px; outline:none;
}
.field textarea{min-height:132px; resize:vertical; line-height:1.55; font-size:14px;}
.field input:focus, .field textarea:focus{border-color:var(--accent);}
.hint{font-size:12px; color:var(--muted-2); line-height:1.5; margin-top:6px;}

/* 状态选择器（长按弹层 / 编辑用） */
.stpick{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;}
.stpick button{
  height:56px; border-radius:13px; border:1px solid var(--line); background:var(--card-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  font-size:12px; font-weight:600; color:var(--text);
}
.stpick button i{width:9px; height:9px; border-radius:50%; display:block;}
.stpick button.on{color:#fff; border-color:transparent;}
.stpick button.on[data-k=dao]{background:var(--s-dao);}
.stpick button.on[data-k=leave]{background:var(--s-leave);}
.stpick button.on[data-k=duty]{background:var(--s-duty);}
.stpick button.on i{background:#fff !important;}

/* 名单行 */
.row{
  display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line-2);
  border-radius:14px; padding:9px 12px; margin-bottom:8px; box-shadow:var(--shadow-s);
}
.row.off{opacity:.55;}
.row .ava{width:38px; height:38px; border-radius:50%; background:#B9BEB7; color:#fff; display:grid; place-items:center; font-size:15px; font-weight:600; overflow:hidden; flex:0 0 38px;}
.row .ava img{width:100%; height:100%; object-fit:cover;}
.row .rowmain{flex:1 1 auto; min-width:0;}
.row .nm{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .sub{font-size:11.5px; color:var(--muted-2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .mini{
  height:32px; padding:0 9px; border-radius:9px; border:1px solid var(--line); font-size:12px; color:var(--muted);
  flex:0 0 auto; display:inline-flex; align-items:center;
}
.row .mini.warn{color:var(--s-absent);}
/* 培训档案：停用徽标 / 元信息 */
.pill{
  display:inline-block; font-size:10px; font-weight:600; line-height:1;
  padding:3px 5px; border-radius:6px; vertical-align:middle; margin-left:6px;
  color:var(--muted-2); border:1px solid var(--line); background:var(--card-2);
}
.pill.off{color:var(--s-absent); border-color:color-mix(in srgb, var(--s-absent) 34%, var(--line));}
.pill.ok{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 34%, var(--line));}
.row .rowmain .sub .dot2{color:var(--muted-2);}
.trsplit{display:flex; gap:6px; flex-wrap:wrap;}
.trsplit > span{
  font-size:11px; color:var(--muted-2); background:var(--line-2);
  border-radius:6px; padding:2px 6px;
}

/* 通用块 */
.sec{margin:12px 0 6px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.sec h2{margin:0; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.3px;}
.sec .act{font-size:12px; color:var(--accent); font-weight:600;}
.panel{background:var(--card); border:1px solid var(--line-2); border-radius:var(--r); padding:12px; box-shadow:var(--shadow-s);}
.actions{display:flex; gap:8px; flex-wrap:wrap;}
.actions .btn{flex:1 1 40%; height:44px; font-size:13.5px;}
.seg{display:flex; gap:4px; background:var(--line-2); padding:3px; border-radius:11px; margin:10px 0 6px;}
.seg button{flex:1 1 0; height:32px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted);}
.seg button.on{background:var(--card); color:var(--text); box-shadow:var(--shadow-s);}
.drow{
  display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line-2);
}
.drow:last-child{border-bottom:0;}
.drow .d1{flex:1 1 auto; min-width:0;}
.drow .d1 .t{font-size:14.5px; font-weight:600;}
.drow .d1 .s{font-size:11.5px; color:var(--muted-2); margin-top:2px;}
.drow .arrow{color:var(--muted-2); font-size:16px;}
table.tb{width:100%; border-collapse:collapse; font-size:12px;}
table.tb th, table.tb td{padding:7px 4px; text-align:right; border-bottom:1px solid var(--line-2); white-space:nowrap;}
table.tb th:first-child, table.tb td:first-child{text-align:left; position:sticky; left:0; background:var(--card);}
table.tb th{color:var(--muted-2); font-weight:600; font-size:11px;}
table.tb td{font-variant-numeric:tabular-nums;}
.tbwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.monthbar{display:flex; align-items:center; gap:8px;}
.monthbar input[type=month]{flex:1 1 auto; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--card-2); padding:0 10px; font-size:14px;}
.kv{display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--line-2);}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600; font-variant-numeric:tabular-nums;}
.toast{
  position:fixed; left:50%; bottom:calc(var(--safe-b) + 118px); transform:translate(-50%, 10px);
  background:rgba(28,30,28,.92); color:#fff; font-size:13px; font-weight:500;
  padding:9px 15px; border-radius:11px; z-index:60; opacity:0; pointer-events:none;
  transition:opacity 150ms ease, transform 150ms ease; max-width:82vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%, 0);}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
/* ============ 培训签到 / 统计（v1.4） ============ */
.trsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px;}
.trsum .box{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:9px 4px;text-align:center;box-shadow:var(--shadow-s);}
.trsum b{display:block;font-size:18px;line-height:1.15;font-variant-numeric:tabular-nums;}
.trsum span{display:block;font-size:11px;color:var(--muted);margin-top:3px;}
.trcourse{width:100%;display:block;text-align:left;background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow-s);}

<script>
"use strict";
/* =====================================================================
   午托点名 v1 —— 单文件 PWA
   存储：IndexedDB（学生 / 记录 / 头像），localStorage 只存界面偏好
   ===================================================================== */

/* ---------------------- 常量 ---------------------- */
var APP_VERSION = "1.5.0";
var DB_NAME = "wudian-db";
/* v1.4：培训四张表（trTeachers / trStudents / trCourses / trAttendance）
   v1.5：新增 trSubjects（培训科目档案）—— 只做加法，不动已有表，午托数据零迁移 */
var DB_VER = 3;
var TR_STORES = ["trTeachers", "trStudents", "trSubjects", "trCourses", "trAttendance"];
var UNDO_LIMIT = 20;          /* 撤销栈深度 */
var LONGPRESS_MS = 500;       /* 长按阈值 */

/* v1.5：两套模式两套底部导航 */
var WUDIAN_TABS = ["roll", "roster", "records"];                 /* 午托底部 */
var TRAIN_TABS = ["signin", "archives", "stats", "info"];        /* 培训底部 */
var ARCH_SEGS = ["students", "teachers", "subjects"];            /* 培训档案内部页签 */

/* v1.2：一天只点名一次，固定记在午餐时段 */
var SLOTS = [
  { k: "lunch", n: "午餐" }
];
var STATUS = [
  { k: "dao",    n: "到",   c: "#22C55E", ink: "#15803D" },
  { k: "leave",  n: "请假", c: "#0EA5E9", ink: "#0369A1" },
  { k: "duty",   n: "值日", c: "#8B5CF6", ink: "#6D28D9" }
];
var ST = {};
STATUS.forEach(function (s) { ST[s.k] = s; });

var WEEK = ["日", "一", "二", "三", "四", "五", "六"];

/* ---------------------- 小工具 ---------------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function el(tag, cls, html) {
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseYmd(s) {
  var p = String(s).split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function addDays(s, n) {
  var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d);
}
function todayStr() { return ymd(new Date()); }
function dateLabel(s) {
  var d = parseYmd(s);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WEEK[d.getDay()];
}
function monthOf(s) { return String(s).slice(0, 7); }
function tsLabel(ts) {
  var d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
    " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function uid() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}
/* 中文名字取首字（复姓简单处理：取第一个字） */
function surname(name) {
  var n = String(name || "").replace(/\s+/g, "");
  return n ? n[0] : "?";
}
/* 姓名归一化用于判重 */
function normName(name) { return String(name || "").replace(/\s+/g, "").trim(); }

var toastTimer = 0;
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("on"); }, 1600);
}

/* ---------------------- IndexedDB ---------------------- */
var dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      /* ---- 午托（v1 起，永不重建，避免清空既有数据） ---- */
      if (!db.objectStoreNames.contains("students")) db.createObjectStore("students", { keyPath: "id" });
      if (!db.objectStoreNames.contains("records"))  db.createObjectStore("records",  { keyPath: "key" });
      if (!db.objectStoreNames.contains("avatars"))  db.createObjectStore("avatars",  { keyPath: "id" });
      if (!db.objectStoreNames.contains("kv"))       db.createObjectStore("kv");

      /* ---- 培训（v2 新增，独立四张表，与午托完全分离） ---- */
      if (!db.objectStoreNames.contains("trTeachers")) {
        db.createObjectStore("trTeachers", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("trStudents")) {
        db.createObjectStore("trStudents", { keyPath: "id" });
      }
      /* v1.5：科目档案（由 v1.4 老师/课程的旧科目文本自动迁移而来） */
      if (!db.objectStoreNames.contains("trSubjects")) {
        var subs = db.createObjectStore("trSubjects", { keyPath: "id" });
        subs.createIndex("byName", "name", { unique: false });
      }
      if (!db.objectStoreNames.contains("trCourses")) {
        var cs = db.createObjectStore("trCourses", { keyPath: "id" });
        cs.createIndex("byDate", "date", { unique: false });      /* 按日取课表 */
        cs.createIndex("byTeacher", "teacherId", { unique: false });
      }
      if (!db.objectStoreNames.contains("trAttendance")) {
        var as = db.createObjectStore("trAttendance", { keyPath: "key" });  /* 主键 courseId|studentId */
        as.createIndex("byCourse", "courseId", { unique: false });
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
  return dbPromise;
}
function tx(store, mode) {
  return openDb().then(function (db) { return db.transaction(store, mode).objectStore(store); });
}
function idbAll(store) {
  return tx(store, "readonly").then(function (os) {
    return new Promise(function (res, rej) {
      var r = os.getAll();
      r.onsuccess = function () { res(r.result || []); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbPut(store, val, key) {
  return tx(store, "readwrite").then(function (os) {
    return new Promise(function (res, rej) {
      var r = key === undefined ? os.put(val) : os.put(val, key);
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbDel(store, key) {
  return tx(store, "readwrite").then(function (os) {
    return new Promise(function (res, rej) {
      var r = os.delete(key);
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbClear(store) {
  return tx(store, "readwrite").then(function (os) {
    return new Promise(function (res, rej) {
      var r = os.clear();
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  });
}

/* =====================================================================
   培训数据层与对外接口（v1.4 数据层 / v1.5 增加科目档案）
   ---------------------------------------------------------------------
   · 与午托完全隔离：五张独立表 + 独立 id 前缀（tch- / tst- / subj- / crs-）
   · v1.5：trSubjects 科目档案，老师 subjectIds 多科任教，课程 subjectId + subjectName 快照
   · 签到状态只有三种：出勤 / 迟到 / 请假（没有"待点名"）
   · 同一学生一天多节课、同一老师一天多节课、同一时间多个老师上课 —— 都允许
   · 对外稳定接口：window.Training（= TR.api），签到与统计页复用，不要改签名
   ===================================================================== */
var TR_SCHEMA = 2;   /* v1.5：快照增加 subjects 段 */
var TR_STATUS = [
  { k: "present", n: "出勤", c: "#22C55E", ink: "#15803D" },
  { k: "late",    n: "迟到", c: "#F59E0B", ink: "#B45309" },
  { k: "leave",   n: "请假", c: "#0EA5E9", ink: "#0369A1" }
];
var TR_ST = {};
TR_STATUS.forEach(function (s) { TR_ST[s.k] = s; });

var TR = {
  teachers: [],
  students: [],
  subjects: [],               /* v1.5：科目档案 */
  courses: [],
  attendance: new Map(),      /* "courseId|studentId" -> {key,courseId,studentId,status,updatedAt} */
  loaded: false,
  loadPromise: null
};

/* ---------- 归一化小工具 ---------- */
function trTxt(v) { return String(v == null ? "" : v).trim(); }
/* 科目名归一化：去首尾空格、连续空白并作一个空格 */
function trSubName(v) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim(); }
/* 科目判重键：忽略多余空白与大小写差异 */
function trSubKey(v) { return trSubName(v).toLowerCase(); }
function isYmd(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }
/* "9:5" / "09:05" / "0905" -> "09:05"；认不出返回 "" */
function trTime(v) {
  var s = trTxt(v);
  if (!s) return "";
  var m = s.match(/^(\d{1,2})\s*[:：.]\s*(\d{1,2})$/);
  if (!m) return "";
  var h = +m[1], mi = +m[2];
  if (h > 23 || mi > 59) return "";
  return pad2(h) + ":" + pad2(mi);
}
function trUniqueIds(list) {
  var out = [], seen = {};
  (Array.isArray(list) ? list : []).forEach(function (id) {
    var v = trTxt(id);
    if (!v || seen[v]) return;
    seen[v] = 1; out.push(v);
  });
  return out;
}
function trCourseKey(courseId, studentId) { return courseId + "|" + studentId; }
function trTeacherById(id) {
  for (var i = 0; i < TR.teachers.length; i++) if (TR.teachers[i].id === id) return TR.teachers[i];
  return null;
}
function trStudentById(id) {
  for (var i = 0; i < TR.students.length; i++) if (TR.students[i].id === id) return TR.students[i];
  return null;
}
function trCourseById(id) {
  for (var i = 0; i < TR.courses.length; i++) if (TR.courses[i].id === id) return TR.courses[i];
  return null;
}
function trSubjectById(id) {
  for (var i = 0; i < TR.subjects.length; i++) if (TR.subjects[i].id === id) return TR.subjects[i];
  return null;
}
/* 科目名精确查找（忽略空白与大小写） */
function trSubjectByName(name) {
  var k = trSubKey(name);
  if (!k) return null;
  for (var i = 0; i < TR.subjects.length; i++) if (trSubKey(TR.subjects[i].name) === k) return TR.subjects[i];
  return null;
}
/* subjectIds 清洗：去空、去重，只保留真实存在的科目 id */
function trCleanSubjectIds(list) {
  var out = [], seen = {};
  (Array.isArray(list) ? list : []).forEach(function (id) {
    var v = trTxt(id);
    if (!v || seen[v]) return;
    if (!trSubjectById(v)) return;
    seen[v] = 1; out.push(v);
  });
  return out;
}
/* 老师 haystack 里拼上任教科目名，旧 subject 文本与科目档案都能搜到 */
function trTeacherSubjectNames(t) {
  return (t.subjectIds || []).map(function (id) {
    var s = trSubjectById(id);
    return s ? s.name : "";
  }).filter(function (n) { return !!n; }).join(" ");
}
/* 老师行显示文本：任教科目用「、」连接（如 数学、奥数）；
   没挂科目档案的老老师回退旧 subject 文本，再回退"未填科目" */
function trTeacherSubjectText(t) {
  if (!t) return "未填科目";
  var ids = trCleanSubjectIds(t.subjectIds);
  if (ids.length) {
    var names = ids.map(function (id) {
      var s = trSubjectById(id);
      return s ? s.name : "";
    }).filter(function (n) { return !!n; });
    if (names.length) return names.join("、");
  }
  return trSubName(t.subject) || "未填科目";
}
/* 课程科目显示文本：优先名称快照（改名不改历史），再退旧文本，
   再退老师任教科目，最后兜底；任何情况不出现 undefined */
function trCourseSubjectText(c) {
  if (!c) return "未填科目";
  var snap = trSubName(c.subjectName) || trSubName(c.subject);
  if (snap) return snap;
  var viaId = c.subjectId ? trSubjectById(c.subjectId) : null;
  if (viaId) return viaId.name;
  var t = trTeacherById(c.teacherId);
  if (t) {
    var names = trCleanSubjectIds(t.subjectIds).map(function (id) {
      var s = trSubjectById(id); return s ? s.name : "";
    }).filter(function (n) { return !!n; });
    if (names.length === 1) return names[0];
  }
  return "未填科目";
}
/* 统计归并桶：优先按 subjectId 归并；没有 subjectId 的旧课程按科目文本归并。
   返回 { key -> { name, count } }，name 用当前档案名（按 ID 归并时）或原文（按文本归并时） */
function trSubjectBuckets(courses) {
  var out = {};
  (courses || []).forEach(function (c) {
    var id = trTxt(c && c.subjectId);
    var text = trSubName(c && c.subjectName) || trSubName(c && c.subject);
    var key, name;
    if (id && trSubjectById(id)) {
      key = "id:" + id;
      name = trSubjectById(id).name;          /* 按 ID 归并：显示档案现名，旧文本保留在课程里 */
    } else {
      key = "txt:" + trSubKey(text || "未填科目");
      name = text || "未填科目";               /* 无 ID 旧数据：按文本归并，保留原文 */
    }
    if (!out[key]) out[key] = { name: name, count: 0 };
    out[key].count++;
  });
  return out;
}
function trSortSubjects() {
  TR.subjects.sort(function (a, b) {
    var oa = a.active === false ? 1 : 0, ob = b.active === false ? 1 : 0;

/* ---------- v1.4 → v1.5 科目迁移（幂等，只补不删） ----------
   · 老师旧 subject 文本、课程旧 subject 文本 → 科目档案（同名只录一条）
   · 旧老师记录自动补 subjectIds（文本能对上科目时挂上）
   · 旧课程补 subjectId + subjectName 快照；已有快照不得用科目现名覆盖——
     科目改名后 reload，历史课程仍保留旧快照；仅当课程缺快照时才补写 */
function trMigrateSubjects() {
  var writes = [];
  var changed = { subjects: 0, teachers: 0, courses: 0 };

  /* 1) 收集老师/课程里的旧科目文本，缺科目档案就补建。
     老师侧：已有 subjectIds 的老师，subject 只是多科合成快照（如「数学、奥数」），
     不能再当成一个科目名归档；只有无任教科目的旧文本老师才归档 */
  TR.teachers.forEach(function (t) {
    if (trCleanSubjectIds(t.subjectIds).length) return;
    var name = trSubName(t.subject);
    if (name && !trSubjectByName(name)) {
      var s = trNewSubject({ name: name });
      TR.subjects.push(s);
      writes.push(idbPut("trSubjects", s));
      changed.subjects++;
    }
  });
  TR.courses.forEach(function (c) {
    var name = trSubName(c.subject);
    if (name && !trSubjectByName(name)) {
      var s = trNewSubject({ name: name });
      TR.subjects.push(s);
      writes.push(idbPut("trSubjects", s));
      changed.subjects++;
    }
  });
  trSortSubjects();

  /* 2) 老师补 subjectIds：已有数组里合法 id ∪ 文本匹配科目；字段缺失视为旧记录 */
  TR.teachers.forEach(function (t) {
    var ids = trCleanSubjectIds(t.subjectIds);
    var name = trSubName(t.subject);
    var m = name ? trSubjectByName(name) : null;
    if (m && ids.indexOf(m.id) < 0) ids.push(m.id);
    var before = JSON.stringify(Array.isArray(t.subjectIds) ? t.subjectIds : []);
    if (JSON.stringify(ids) !== before) {
      t.subjectIds = ids;
      writes.push(idbPut("trTeachers", t));
      changed.teachers++;
    }
  });

  /* 3) 课程补 subjectId / subjectName：文本能匹配就落 ID + 名称快照；
        已有快照不覆盖（保留历史原貌），缺快照才补写；悬空 ID 清掉留文本 */
  TR.courses.forEach(function (c) {
    var dirty = false;
    var cur = trSubjectById(c.subjectId);
    if (cur) {
      if (!trTxt(c.subjectName)) { c.subjectName = cur.name; dirty = true; }
    } else {
      var name = trSubName(c.subject);
      var m = name ? trSubjectByName(name) : null;
      if (m) {
        if (c.subjectId !== m.id) { c.subjectId = m.id; dirty = true; }
        if (!trTxt(c.subjectName)) { c.subjectName = m.name; dirty = true; }
      } else if (c.subjectId && !trSubjectById(c.subjectId)) {
        c.subjectId = "";          /* 指向不存在的科目：清掉悬空 ID，保留文本 */
        dirty = true;
      }
    }
    if (dirty) {
      writes.push(idbPut("trCourses", c));
      changed.courses++;
    }
    if (c.subjectName === undefined) {   /* 旧记录缺快照字段：补文本/空串，显示不出现 undefined */
      c.subjectName = trTxt(c.subject);
      writes.push(idbPut("trCourses", c));
      changed.courses++;
    }
  });

  return Promise.all(writes).then(function () { return changed; });
}

/* 恢复五张培训表：老师 / 学生 / 科目 / 课程 / 签到。
   v1.4 旧快照没有 subjects 段也照常恢复——loadTraining 里的迁移会用
   老师/课程的旧科目文本自动补建科目并补齐关联（幂等）。 */
function trRestoreSnapshot(snap) {
  var s = snap || {};
  var subjects = Array.isArray(s.subjects) ? s.subjects : [];
  var teachers = Array.isArray(s.teachers) ? s.teachers : [];
  var students = Array.isArray(s.students) ? s.students : [];
  var courses = Array.isArray(s.courses) ? s.courses : [];
  var att = Array.isArray(s.attendance) ? s.attendance : [];
  /* 只保留结构完整的条目，坏数据不入库 */
  subjects = subjects.filter(function (x) { return x && x.id && trSubName(x.name); });
  teachers = teachers.filter(function (t) { return t && t.id && trTxt(t.name); });
  students = students.filter(function (t) { return t && t.id && trTxt(t.name); });
  courses = courses.filter(function (c) { return c && c.id && isYmd(c.date); });
  var courseIds = {};
  courses.forEach(function (c) { courseIds[c.id] = 1; });
  att = att.filter(function (a) {
    return a && a.courseId && a.studentId && TR_ST[a.status] && courseIds[a.courseId];
  });
  return Promise.all(TR_STORES.map(idbClear)).then(function () {
    var jobs = [];
    subjects.forEach(function (x) { jobs.push(idbPut("trSubjects", x)); });
    teachers.forEach(function (t) { jobs.push(idbPut("trTeachers", t)); });
    students.forEach(function (t) { jobs.push(idbPut("trStudents", t)); });
    courses.forEach(function (c) {
      var cc = Object.assign({}, c);
      cc.studentIds = trUniqueIds(c.studentIds);
      jobs.push(idbPut("trCourses", cc));
    });
    att.forEach(function (a) {
      var rec = Object.assign({}, a);
      rec.key = trCourseKey(a.courseId, a.studentId);
      jobs.push(idbPut("trAttendance", rec));
    });
    return Promise.all(jobs);
  }).then(function () {
    TR.loadPromise = null; TR.loaded = false;
    return loadTraining().then(function () {
      return {
        subjects: TR.subjects.length,
        teachers: TR.teachers.length,
        students: TR.students.length,
        courses: TR.courses.length,
        attendance: TR.attendance.size
      };
    });
  });
}

/* ---------- 分组文本 → 年级/班（v1.1 排序用） ----------
   认得这些写法：一 / 一1班 / 二3班 / 三年级 / 3年级 / 三年级2班 / 301班（＝3 年级 1 班）
   解析不出的一律 null → 排到最后 */
var CN_DIGIT = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10 };
function digitOf(ch) {
  if (ch == null || ch === "") return null;
  if (/^\d$/.test(ch)) return +ch;
  return CN_DIGIT[ch] || null;
}
function parseGroup(g) {
  var s = String(g == null ? "" : g).trim();
  if (!s) return null;
  /* 全角数字→半角，去空白，避免「三 2 班」「三年级２班」认不出 */
  s = s.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
       .replace(/\s+/g, "");
  var m, gd;
  /* 1) 三年级 / 3年级 / 三年级2班 */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*年级\s*(\d{1,2})?\s*班?/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: m[2] ? +m[2] : null, raw: s };
  }
  /* 2) 一1班 / 二3班 / 301班 */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*(\d{1,2})\s*班/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: +m[2], raw: s };
  }
  /* 2b) 一(1) / 一(1)班 / 一（1） */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*[（(]\s*(\d{1,2})\s*[)）]\s*班?/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: +m[2], raw: s };
  }
  /* 3) 一班 / 1班 */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*班/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: null, raw: s };
  }
  return null;
}

/* 旧规则：分组（数字优先按数值）→ 序号 → 姓名，仅供记录页/CSV 沿用 */
function cmpGroup(a, b) {
  var ga = String(a || "").trim(), gb = String(b || "").trim();
  if (!ga && gb) return 1;      /* 未分组排最后 */
  if (ga && !gb) return -1;
  var na = parseFloat(ga), nb = parseFloat(gb);
  var an = !isNaN(na), bn = !isNaN(nb);
  if (an && bn && na !== nb) return na - nb;
  if (an !== bn) return an ? -1 : 1;
  return ga.localeCompare(gb, "zh-Hans-CN");
}

/* 统一比较器（点名页 + 名单页共用）：
   年级升序 → 班级（班号优先，否则组名 localeCompare）→ 序号 → 姓名
   解析不出年级的分组一律排最后，组内沿用旧规则 */
function compareStudents(a, b) {
  var pa = parseGroup(a.group), pb = parseGroup(b.group);
  if (pa && pb) {
    if (pa.grade !== pb.grade) return pa.grade - pb.grade;
    if (pa.cls != null && pb.cls != null && pa.cls !== pb.cls) return pa.cls - pb.cls;
    var cn = String(a.group || "").localeCompare(String(b.group || ""), "zh-Hans-CN");
    if (cn) return cn;
  } else if (pa || pb) {
    return pa ? -1 : 1;
  } else {
    var og = cmpGroup(a.group, b.group);
    if (og) return og;
  }
  var sa = (a.seq == null ? 1e9 : a.seq), sb = (b.seq == null ? 1e9 : b.seq);
  if (sa !== sb) return sa - sb;
  return String(a.name).localeCompare(String(b.name), "zh-Hans-CN");
}
function sortStudents(list) {
  return list.slice().sort(compareStudents);
}
function slotOrder(k) {
  for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i].k === k) return i;
  return 9;
}
function slotName(k) {
  for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i].k === k) return SLOTS[i].n;
  return k;
}

/* 压缩到 200×200 JPEG 0.75（居中裁方形） */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        var cv = document.createElement("canvas");
        cv.width = 200; cv.height = 200;
        var ctx = cv.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 200, 200);
        ctx.drawImage(img, sx, sy, side, side, 0, 0, 200, 200);
        cv.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (blob) resolve(blob); else reject(new Error("图片压缩失败"));
        }, "image/jpeg", 0.75);
      } catch (err) { URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
    img.src = url;
  });
}

/* =====================================================================
   点名页
   ===================================================================== */
function countByStatus(date, slot, list) {
  var out = { dao: 0, leave: 0, duty: 0, none: 0, total: list.length };
  list.forEach(function (s) {
    var r = getRec(s.id, date, slot);
    if (r && out[r.status] != null) out[r.status]++; else out.none++;
  });
  out.marked = out.total - out.none;
  return out;
}

function buildRollView() {
  var students = activeStudents();
  var wrap = document.createDocumentFragment();

  if (!S.students.length) {
    var e1 = el("div", "empty");
    e1.innerHTML = '<div class="big">还没有学生</div>名单里还没有人。<br>先去「名单」页添加，或批量粘贴导入。' +
      '<br><button id="goRoster">去名单页导入</button>';
    wrap.appendChild(e1);
    return { node: wrap, empty: "no-student" };
  }

  /* 搜索 */
  var se = el("div", "search");
  var input = el("input");
  input.type = "search";
  input.placeholder = "搜索姓名或分组";
  input.value = S.search;
  input.setAttribute("aria-label", "搜索学生");
  input.addEventListener("input", function () {
    S.search = input.value;
    renderGridOnly();     /* 只重绘网格，不打断输入焦点 */
  });
  se.appendChild(input);
  wrap.appendChild(se);

  /* 筛选 chips */
  var c = countByStatus(S.date, S.slot, students);
  var fw = el("div", "filters");
  var fdefs = [{ k: "all", n: "全部", c: c.total }, { k: "none", n: "未点", c: c.none }]
    .concat(STATUS.map(function (s) { return { k: s.k, n: s.n, c: c[s.k] }; }));
  fdefs.forEach(function (f) {
    var b = el("button", "fchip" + (S.filter === f.k ? " on" : ""));
    b.dataset.filter = f.k;
    b.innerHTML = f.n + '<span class="cnt">' + f.c + "</span>";
    b.addEventListener("click", function () { S.filter = f.k; render(); });
    fw.appendChild(b);
  });
  wrap.appendChild(fw);

  /* 网格容器 */
  var grid = el("div", "grid");
  grid.id = "grid";
  wrap.appendChild(grid);
  var emptyHint = el("div", "empty");
  emptyHint.id = "gridEmpty";
  emptyHint.hidden = true;
  wrap.appendChild(emptyHint);

  return { node: wrap };
}

function matchFilters(s) {
  if (S.search) {
    var q = S.search.trim().toLowerCase();
    if (q) {
      var hay = (String(s.name) + " " + String(s.group || "")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
  }
  if (S.filter === "all") return true;
  var r = getRec(s.id);
  var st = r ? r.status : "none";
  return st === S.filter;
}

/* 点名页主显示名（只影响显示，不改数据）
   ≤3 字 → 全名；4 字 → 后 2 字；≥5 字 → 后 3 字 */
function displayName(name) {
  var n = normName(name);
  var len = Array.from(n).length;
  if (len <= 3) return n;
  if (len === 4) return n.slice(n.length - 2);
  return n.slice(n.length - 3);
}

/* 卡片：无头像圆，只有 状态标签 + 状态点 + 大名字 + 班级小字 */
function cardHtml(s) {
  var r = getRec(s.id);
  var st = r ? r.status : "";
  return '<span class="tag">' + (st ? ((ST[st] || {}).n || "") : "") + "</span>" +
    '<span class="dot"></span>' +
    '<span class="nm">' + esc(displayName(s.name)) + "</span>" +
    '<span class="gp">' + esc(s.group || "\u00a0") + "</span>";
}
/* 名字 -> 稳定色（名单页/记录页无头像时的色块用） */
var PALETTE = ["#8E9BA8", "#A8917C", "#7E9A8A", "#9A8AA8", "#A8957E", "#7F93A8", "#A88282"];
function colorFor(name) {
  var n = String(name || ""), h = 0;
  for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 997;
  return PALETTE[h % PALETTE.length];
}

function renderGridOnly() {
  var grid = $("#grid");
  if (!grid) return;
  var list = sortStudents(activeStudents()).filter(matchFilters);
  /* v1.2：未点名的始终在上，已点名的沉底；两组内部都保持年级升序 */
  list.sort(function (a, b) {
    var ma = getRec(a.id) ? 1 : 0, mb = getRec(b.id) ? 1 : 0;
    if (ma !== mb) return ma - mb;
    return compareStudents(a, b);
  });
  var frag = document.createDocumentFragment();
  list.forEach(function (s) {
    var b = el("button", "card");
    b.dataset.id = s.id;
    b.dataset.st = (getRec(s.id) || {}).status || "";
    b.innerHTML = cardHtml(s);
    b.className = "card " + (b.dataset.st ? "st-" + b.dataset.st : "st-none");
    frag.appendChild(b);
  });
  grid.innerHTML = "";
  grid.appendChild(frag);
  var eh = $("#gridEmpty");
  if (eh) {
    if (!list.length) {
      eh.hidden = false;
      eh.innerHTML = '<div class="big">没有符合条件的学生</div>换个关键词，或把筛选切回「全部」。';
    } else { eh.hidden = true; }
  }
  refreshRollChrome();
}

/* 进度 + 统计条 */
function refreshRollChrome() {
  var students = activeStudents();
  var c = countByStatus(S.date, S.slot, students);
  $("#progText").textContent = "已点 " + c.marked + "/" + c.total;
  $("#progFill").style.width = (c.total ? (c.marked / c.total * 100) : 0) + "%";

  var sb = $("#statsBar");
  var html = "";
  STATUS.forEach(function (s) {

/* 应用一个状态（幂等） */
function applyStatus(sid, status) {
  var key = recKey(S.date, S.slot, sid);
  var cur = S.records.get(key) || null;
  if (cur && cur.status === status) {
    return Promise.resolve({ changed: false, reason: "same" });   /* 幂等：不重复写 */
  }
  var rec = {
    key: key, date: S.date, slot: S.slot, studentId: sid,
    status: status, updatedAt: Date.now()
  };
  return idbPut("records", rec).then(function () {
    S.records.set(key, rec);
    pushUndo({ key: key, studentId: sid, date: S.date, slot: S.slot, prev: cur ? cloneRec(cur) : null });
    renderGridOnly();     /* 重新排序：已点名的沉到底部 */
    return { changed: true };
  });
}
function cloneRec(r) {
  return { key: r.key, date: r.date, slot: r.slot, studentId: r.studentId, status: r.status, updatedAt: r.updatedAt };
}
function pushUndo(op) {
  S.undo.push(op);
  if (S.undo.length > UNDO_LIMIT) S.undo.shift();
}
/* 长按状态选择弹层 */
function openStudentSheet(sid) {
  var s = studentById(sid);
  if (!s) return;
  var cur = getRec(sid);
  var html = '<div class="grab"></div><div class="sh-hd"><h3>' + esc(s.name) +
    ' <span style="font-size:12px;font-weight:500;color:var(--muted-2)">' + esc(s.group || "未分组") +
    " · " + slotName(S.slot) + '</span></h3><button class="x" data-close>✕</button></div>' +
    '<div class="sh-bd"><div class="stpick" id="stpick">';
  STATUS.forEach(function (st) {
    html += '<button data-k="' + st.k + '"' + (cur && cur.status === st.k ? ' class="on"' : "") + ">" +
      '<i style="background:' + st.c + '"></i>' + st.n + "</button>";
  });
  html += "</div></div>";
  html += '<div class="sh-ft"><button class="btn danger" id="clearRec">清除本次记录</button></div>';
  html += '<div style="height:6px"></div>';
  openSheet(html, {
    onMount: function (sh) {
      sh.querySelector("[data-close]").addEventListener("click", closeSheet);
      sh.querySelector("#stpick").addEventListener("click", function (ev) {
        var b = ev.target.closest("button[data-k]");
        if (!b) return;
        applyStatus(sid, b.dataset.k).then(function (r) {
          closeSheet();
          if (!r.changed) toast("已是「" + ST[b.dataset.k].n + "」，未重复记录");
        });
      });
      sh.querySelector("#clearRec").addEventListener("click", function () {
        var key = recKey(S.date, S.slot, sid);
        var prev = S.records.get(key);
        if (!prev) { closeSheet(); toast("本次还没有记录"); return; }
        idbDel("records", key).then(function () {
          S.records.delete(key);
          pushUndo({ key: key, studentId: sid, date: S.date, slot: S.slot, prev: cloneRec(prev) });
          renderGridOnly(); closeSheet();
          toast("已清除 " + s.name + " 的本次记录");
        });
      });
    }
  });
}

/* 撤销 */
function undoOnce() {
  var op = S.undo.pop();
  if (!op) return Promise.resolve(false);
  var p;
  if (op.prev) {
    p = idbPut("records", op.prev).then(function () { S.records.set(op.key, op.prev); });
  } else {
    p = idbDel("records", op.key).then(function () { S.records.delete(op.key); });
  }
  return p.then(function () {
    /* 撤销的是别处的记录时，跳到那里让用户看见结果 */
    if (op.date !== S.date || op.slot !== S.slot) {
      S.date = op.date; S.slot = op.slot; savePref(); render();
    } else {
      renderGridOnly();
    }
    var stName = op.prev ? ST[op.prev.status].n : "未点";
    toast("已撤销，恢复为「" + stName + "」");
    return true;
  });
}

/* 网格交互：点击标记 / 长按弹出 */
var lpTimer = 0, lpFired = false, lpStart = null;

function bindGrid() {
  var grid = $("#grid");
  if (!grid) return;

  grid.addEventListener("pointerdown", function (ev) {
    var card = ev.target.closest(".card");
    if (!card) return;
    lpFired = false;
    lpStart = { x: ev.clientX, y: ev.clientY, id: card.dataset.id };
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function () {
      if (!lpStart) return;
      lpFired = true;
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
      openStudentSheet(lpStart.id);
      lpStart = null;
    }, LONGPRESS_MS);
  });

  grid.addEventListener("pointermove", function (ev) {
    if (!lpStart) return;
    if (Math.abs(ev.clientX - lpStart.x) > 10 || Math.abs(ev.clientY - lpStart.y) > 10) {
      clearTimeout(lpTimer); lpStart = null;      /* 手指划动 = 滚动，取消长按 */
    }
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) {
    grid.addEventListener(t, function () { clearTimeout(lpTimer); lpStart = null; });
  });

  grid.addEventListener("click", function (ev) {
    var card = ev.target.closest(".card");
    if (!card) return;
    if (lpFired) { lpFired = false; return; }     /* 长按已处理，抑制点击 */
    var sid = card.dataset.id;
    var cur = getRec(sid);
    if (cur && cur.status === S.brush) {
      /* 幂等：同状态不重复写记录，给一个轻提示 */
      toast("已是「" + ST[S.brush].n + "」，未重复记录");
      return;
    }
    applyStatus(sid, S.brush);
  });
}

/* 批量导入 */
function parseImportText(text) {
  var lines = String(text).split(/\r?\n/);
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var name = "", group = "";
    if (/[,，\t]/.test(line)) {
      var p = line.split(/[,，\t]/);
      name = p[0].trim();
      group = (p[1] || "").trim();
    } else {
      name = line.replace(/\s+/g, " ").trim();
    }
    if (!name) continue;
    out.push({ name: name, group: group });
  }
  return out;
}

function openBulkSheet() {
  var html = '<div class="grab"></div><div class="sh-hd"><h3>批量导入</h3><button class="x" data-close>✕</button></div>' +
    '<div class="sh-bd"><div class="field"><label>粘贴名单，每行一个</label>' +
    '<textarea id="bulkTa" placeholder="李小明&#10;王小雨,A组&#10;张三,一班"></textarea>' +
    '<div class="hint">支持两种格式：<b>姓名</b> 或 <b>姓名,分组</b>。<br>空行自动跳过，重名（与现有名单或本次重复）自动跳过。</div></div>' +
    '<div class="panel" style="padding:10px 12px"><div class="kv"><span class="k">将导入</span><span class="v" id="bulkCount">0 条</span></div>' +
    '<div class="kv"><span class="k">重复跳过</span><span class="v" id="bulkDup">0 条</span></div></div></div>' +
    '<div class="sh-ft"><button class="btn" data-close>取消</button><button class="btn primary" id="bulkOk" disabled>导入</button></div>' +
    '<div style="height:8px"></div>';
  openSheet(html, {
    onMount: function (sh) {
      var ta = sh.querySelector("#bulkTa");
      var ok = sh.querySelector("#bulkOk");
      sh.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeSheet); });

      function calc() {
        var rows = parseImportText(ta.value);
        var exist = new Set(S.students.map(function (s) { return normName(s.name); }));
        var seen = new Set(), fresh = 0, dup = 0;
        rows.forEach(function (r) {
          var k = normName(r.name);
          if (exist.has(k) || seen.has(k)) { dup++; return; }
          seen.add(k); fresh++;
        });
        sh.querySelector("#bulkCount").textContent = fresh + " 条";
        sh.querySelector("#bulkDup").textContent = dup + " 条";
        ok.disabled = fresh === 0;
        return { rows: rows, seen: seen, fresh: fresh };
      }
      ta.addEventListener("input", calc);
      setTimeout(function () { ta.focus(); }, 220);

      ok.addEventListener("click", function () {
        var st = calc();
        if (!st.fresh) return;
        var exist = new Set(S.students.map(function (s) { return normName(s.name); }));
        var seqByGroup = {};
        S.students.forEach(function (s) {
          var g = s.group || "";
          if (s.seq && (!seqByGroup[g] || s.seq > seqByGroup[g])) seqByGroup[g] = s.seq;
        });
        var added = [];
        st.rows.forEach(function (r) {
          var k = normName(r.name);
          if (exist.has(k)) return;
          exist.add(k);
          var g = r.group || "";
          seqByGroup[g] = (seqByGroup[g] || 0) + 1;
          added.push({
            id: uid(), name: r.name, group: g, seq: seqByGroup[g],
            note: "", active: true, avatarId: null
          });
        });
        Promise.all(added.map(function (s) { return idbPut("students", s); })).then(function () {
          S.students = S.students.concat(added);
          closeSheet();
          toast("已导入 " + added.length + " 人");
          renderRoster();
        });
      });
    }
  });
}

/* =====================================================================
   培训签到与统计（v1.4）
   ---------------------------------------------------------------------
   · 一节课 = 日期 + 起止时间 + 老师 + 多名学生
   · 学生状态只有 出勤 / 迟到 / 请假，提交前必须逐个归入状态
   · 同一学生同一时间不能同时安排给两位老师；同一时间允许多位老师各自开课
   ===================================================================== */
function trTeacherName(id) { var t = trTeacherById(id); return t ? t.name : "老师已停用"; }
function trStudentName(id) { var t = trStudentById(id); return t ? t.name : "学生已停用"; }
function trStudentClass(id) { var t = trStudentById(id); return t ? (t.gradeClass || "") : ""; }
function trOverlaps(aS, aE, bS, bE) { return String(aS) < String(bE) && String(bS) < String(aE); }

function trFindConflicts(studentIds, date, startTime, endTime, excludeCourseId) {
  var out = [];
  TR.courses.forEach(function (c) {
    if (excludeCourseId && c.id === excludeCourseId) return;
    if (c.date !== date || !c.startTime || !c.endTime) return;
    if (!trOverlaps(startTime, endTime, c.startTime, c.endTime)) return;
    studentIds.forEach(function (sid) {
      if ((c.studentIds || []).indexOf(sid) < 0) return;
      out.push({
        studentId: sid, student: trStudentName(sid), teacher: trTeacherName(c.teacherId),
        time: c.startTime + "-" + c.endTime, courseId: c.id
      });
    });
  });
  return out;
}

function trCourseStats(courseId) {
  var c = trCourseById(courseId);
  var out = { present: 0, late: 0, leave: 0, missing: 0, total: c ? (c.studentIds || []).length : 0 };
  if (!c) return out;
  var map = TR_API.attendanceMap(courseId);
  (c.studentIds || []).forEach(function (sid) {
    if (out[map[sid]] != null) out[map[sid]]++; else out.missing++;
  });
  return out;
}

function trSaveSignin(data) {
  return Promise.resolve().then(function () {
    var courseId = trTxt(data.courseId);
    var date = trTxt(data.date);
    var startTime = trTime(data.startTime);
    var endTime = trTime(data.endTime);
    var teacherId = trTxt(data.teacherId);
    var studentIds = trUniqueIds(data.studentIds);
    var subjectId = trTxt(data.subjectId);
    var subject = trTxt(data.subject);
    if (!isYmd(date)) throw new Error("请选择上课日期");
    if (!teacherId) throw new Error("请选择老师");
    if (!startTime || !endTime) throw new Error("请填写开始和结束时间");
    if (endTime <= startTime) throw new Error("结束时间必须晚于开始时间");
    if (!studentIds.length) throw new Error("请至少选择一名学生");
    /* v1.5：新建课程必须选科目；编辑旧课程允许保留无科目的历史记录。
       只传旧式科目文本也照常可用（文本能对上科目就顺带落 ID） */
    if (!subjectId && subject) {
      var m = trSubjectByName(subject);
      if (m) subjectId = m.id;
    }
    if (!courseId && !subjectId && !subject) throw new Error("请选择科目");
    if (subjectId && !trSubjectById(subjectId)) throw new Error("科目不存在：" + subjectId);

    var rows = [], missing = [];
    studentIds.forEach(function (sid) {
      var st = data.statuses && data.statuses[sid];
      if (!TR_ST[st]) missing.push(trStudentName(sid));
      else rows.push({ studentId: sid, status: st });
    });
    if (missing.length) throw new Error("还有学生未选择状态：" + missing.join("、"));

    var conflicts = trFindConflicts(studentIds, date, startTime, endTime, courseId);
    if (conflicts.length) {
      var c0 = conflicts[0];
      throw new Error("时间冲突：" + c0.student + " 已在 " + c0.time + " 上" + c0.teacher + "的课");
    }

    var payload = {
      date: date, startTime: startTime, endTime: endTime, teacherId: teacherId,
      subjectId: subjectId,
      title: trTxt(data.title), room: trTxt(data.room),
      note: trTxt(data.note), studentIds: studentIds
    };
    /* 只在明确给了科目时才覆盖文本；编辑旧课程未选科目时保留历史 subject 文本 */
    if (subject) payload.subject = subject;
    var createdId = courseId;
    var p = courseId ? TR_API.updateCourse(courseId, payload) : TR_API.createCourse(payload);
    return p.then(function (c) {
      createdId = c.id;
      return TR_API.setAttendanceBulk(c.id, rows);
    }).then(function () {
      return TR_API.getCourse(createdId);
    }).catch(function (err) {
      if (!courseId && createdId) return TR_API.removeCourse(createdId).then(function () { throw err; });
      throw err;
    });
  });
}

/* v1.5 签到选科：老师任教科目优先（含停用但仍在任教的历史科目），
   老师没配置科目时回退到全部启用科目；当前值不在候选里就补在最前并标注 */
function trSubjectOptionsFor(teacherId, currentId) {
  var t = trTeacherById(teacherId);
  var mine = t ? trCleanSubjectIds(t.subjectIds) : [];
  var list, used = {};
  if (mine.length) {
    list = mine.map(function (id) { return trSubjectById(id); }).filter(Boolean);
  } else {
    list = TR.subjects.filter(function (s) { return s.active !== false; });
  }
  var opts = [];
  list.forEach(function (s) {
    if (used[s.id]) return;
    used[s.id] = 1;
    opts.push({ id: s.id, name: s.name, off: s.active === false });
  });
  var cur = currentId ? trSubjectById(currentId) : null;
  if (cur && !used[cur.id]) {
    opts.unshift({ id: cur.id, name: cur.name, off: cur.active === false });
    used[cur.id] = 1;
  }
  return opts;
}
function trSubjectSelectHtml(teacherId, currentId, hasCourse) {
  var opts = trSubjectOptionsFor(teacherId, currentId);
  var h = '<option value="">' + (hasCourse ? "（保持未填科目）" : "请选择科目") + "</option>";
  opts.forEach(function (o) {
    h += '<option value="' + esc(o.id) + '"' + (currentId === o.id ? " selected" : "") + ">" +
      esc(o.name) + (o.off ? "（已停用）" : "") + "</option>";
  });
  return h;
}

function openTrCourseSheet(courseId) {

    date: S.date, startTime: "", endTime: "", teacherId: "", subjectId: "", subject: "", note: "", studentIds: []

  var amap = course ? TR_API.attendanceMap(course.id) : {};

    '<div class="field full"><label>日期 *</label><input type="date" id="trDate" value="' + esc(base.date) + '"></div>' +
    '<div class="field"><label>开始时间 *</label><input type="time" id="trStart" value="' + esc(base.startTime || "") + '"></div>' +
    '<div class="field"><label>结束时间 *</label><input type="time" id="trEnd" value="' + esc(base.endTime || "") + '"></div>' +
    '<div class="field full"><label>老师 *</label><select id="trTeacher" class="trselect">' +
    '<option value="">请选择老师</option>' +
    teachers.map(function (t) {
      return '<option value="' + esc(t.id) + '"' + (base.teacherId === t.id ? " selected" : "") + '>' +
        esc(t.name) + " · " + esc(trTeacherSubjectText(t)) + (t.active === false ? "（已停用）" : "") + "</option>";
    }).join("") + '</select></div>' +
    '<div class="field full"><label>科目 *</label><select id="trSubject" class="trselect">' +
    trSubjectSelectHtml(base.teacherId, base.subjectId, !!course) + '</select></div>' +
    '<div class="field full"><label>备注（可选）</label><input type="text" id="trNote" value="' + esc(base.note || "") + '" placeholder="如 补课 / 临时调课"></div>' +
    '</div>';
  h += '<div class="sec"><h2>选择学生</h2><span id="trSelCount" style="font-size:11.5px;color:var(--muted-2)">已选 0 人</span></div>';
  h += '<div class="trbulk">' +
    '<button type="button" data-bulk="present">批量出勤</button>' +
    '<button type="button" data-bulk="late">批量迟到</button>' +
    '<button type="button" data-bulk="leave">批量请假</button>' +
    '<button type="button" id="trClearSel">清空选择</button></div>';
  h += '<input class="trpicksearch" id="trPickSearch" type="search" placeholder="搜索学生姓名 / 班级">';
  h += '<div class="trpicklist" id="trPickList">';
  students.forEach(function (s) {
    var q = [s.name, s.gradeClass, s.contact].join(" ").toLowerCase();
    h += '<div class="trpick" data-sid="' + esc(s.id) + '" data-q="' + esc(q) + '">' +
      '<span class="tick">✓</span><div class="who"><div class="nm">' + esc(s.name) + '</div>' +
      '<div class="cls">' + esc(s.gradeClass || "未填班级") + '</div></div>' +
      trStatusChipHtml(s.id, status[s.id], false) + '</div>';
  });
  h += '</div><div id="trErr" class="field" style="display:none;color:var(--s-absent);font-size:12px;margin-top:8px"></div>';
  h += '</div><div class="sh-ft"><button class="btn primary" id="trCourseSave">保存签到</button>' +
    '<button class="btn" id="trCourseCancel">取消</button></div><div style="height:8px"></div>';

  openSheet(h, {
    onMount: function (sh) {
      var countEl = sh.querySelector("#trSelCount"), errEl = sh.querySelector("#trErr");
      function selectedIds() { return students.filter(function (s) { return sel[s.id]; }).map(function (s) { return s.id; }); }
      function sync() {
        sh.querySelectorAll(".trpick").forEach(function (row) {
          var sid = row.dataset.sid, on = !!sel[sid];
          row.classList.toggle("sel", on);
          row.querySelectorAll("[data-st]").forEach(function (b) {
            b.classList.toggle("on", on && status[sid] === b.dataset.st);
          });
        });
        countEl.textContent = "已选 " + selectedIds().length + " 人 · 已标状态 " + selectedIds().filter(function (sid) { return !!TR_ST[status[sid]]; }).length + " 人";
      }
      function showErr(msg) { errEl.textContent = msg; errEl.style.display = "block"; toast(msg); }
      function clearErr() { errEl.style.display = "none"; errEl.textContent = ""; }

      sh.querySelector("[data-close]").addEventListener("click", closeSheet);
      sh.querySelector("#trCourseCancel").addEventListener("click", closeSheet);
      sh.querySelectorAll(".trpick").forEach(function (row) {
        var sid = row.dataset.sid;
        row.addEventListener("click", function (e) {
          if (e.target.closest("[data-st]")) return;
          if (sel[sid]) { delete sel[sid]; delete status[sid]; }
          else { sel[sid] = 1; }
          clearErr(); sync();
        });
        row.querySelectorAll("[data-st]").forEach(function (b) {
          b.addEventListener("click", function (e) {
            e.stopPropagation();
            sel[sid] = 1; status[sid] = b.dataset.st; clearErr(); sync();
          });
        });
      });
      sh.querySelectorAll("[data-bulk]").forEach(function (b) {
        b.addEventListener("click", function () {
          var ids = selectedIds();
          if (!ids.length) { showErr("请先选择学生"); return; }
          ids.forEach(function (sid) { status[sid] = b.dataset.bulk; });
          clearErr(); sync();
        });
      });
      sh.querySelector("#trClearSel").addEventListener("click", function () {
        sel = {}; status = {}; clearErr(); sync();
      });
      sh.querySelector("#trPickSearch").addEventListener("input", function (e) {
        var q = e.target.value.trim().toLowerCase();
        sh.querySelectorAll(".trpick").forEach(function (row) {
          row.hidden = q && row.dataset.q.indexOf(q) < 0;
        });
      });
      var teacherSel = sh.querySelector("#trTeacher"), subSel = sh.querySelector("#trSubject");
      /* v1.5：换老师后按新老师的任教科目重建科目候选；
         老师只任教一个科目时自动预选，多科时留给前台明确选择 */
      function applyTeacherSubjects(preselect) {
        var tid = teacherSel.value;
        subSel.innerHTML = trSubjectSelectHtml(tid, "", !!course);
        if (preselect) {
          var opts = trSubjectOptionsFor(tid, "");
          if (opts.length === 1) subSel.value = opts[0].id;
        }
      }
      teacherSel.addEventListener("change", function () { applyTeacherSubjects(true); });
      if (course && base.teacherId && !base.subjectId) applyTeacherSubjects(true);  /* 编辑无科目旧课：跟老师科目走 */
      sh.querySelector("#trCourseSave").addEventListener("click", function () {
        clearErr();
        var pickedId = subSel.value;
        var picked = pickedId ? trSubjectById(pickedId) : null;
        var data = {
          courseId: course ? course.id : "",
          date: sh.querySelector("#trDate").value,
          startTime: sh.querySelector("#trStart").value,
          endTime: sh.querySelector("#trEnd").value,
          teacherId: teacherSel.value,
          subjectId: pickedId,
          subject: picked ? picked.name : "",
          note: sh.querySelector("#trNote").value,
          studentIds: selectedIds(),
          statuses: status
        };
        trSaveSignin(data).then(function (c) {
          closeSheet();
          S.date = c.date; S.trTab = "signin"; savePref();
          toast(course ? "课程已更新" : "签到已保存");
          renderTraining();
        }).catch(function (err) { showErr(err && err.message ? err.message : "保存失败"); });
      });
      sync();
    }
  });
}

function trRangeOf(period) {
  var d = S.date;
  if (period === "today") return { from: d, to: d, label: "当日" };
  if (period === "week") {
    var day = (parseYmd(d).getDay() + 6) % 7;
    var mon = addDays(d, -day);
    return { from: mon, to: addDays(mon, 6), label: "本周" };
  }
  var m = monthOf(d);
  return { from: m + "-01", to: m + "-31", label: "本月" };
}

function trStudentStats(sid, range) {
  var courses = TR_API.listCourses({ from: range.from, to: range.to, studentId: sid });
  var out = { total: courses.length, present: 0, late: 0, leave: 0, missing: 0, byTeacher: {}, bySubject: {}, bySubjectNames: {}, courses: courses };
  var buckets = trSubjectBuckets(courses);
  Object.keys(buckets).forEach(function (k) {
    out.bySubject[k] = buckets[k].count;
    out.bySubjectNames[k] = buckets[k].name;
  });
  courses.forEach(function (c) {
    var st = TR_API.attendanceMap(c.id)[sid];
    if (out[st] != null) out[st]++; else out.missing++;
    out.byTeacher[c.teacherId] = (out.byTeacher[c.teacherId] || 0) + 1;
  });
  return out;
}

function trTeacherStats(tid, range) {
  var courses = TR_API.listCourses({ from: range.from, to: range.to, teacherId: tid }).filter(function (c) {
    return (c.studentIds || []).length > 0;
  });
  var out = { total: courses.length, people: 0, present: 0, late: 0, leave: 0, missing: 0, byDate: {}, bySubject: {}, bySubjectNames: {}, courses: courses };
  var buckets = trSubjectBuckets(courses);
  Object.keys(buckets).forEach(function (k) {
    out.bySubject[k] = buckets[k].count;
    out.bySubjectNames[k] = buckets[k].name;
  });
  courses.forEach(function (c) {
    var map = TR_API.attendanceMap(c.id);
    (c.studentIds || []).forEach(function (sid) {
      out.people++;
      if (out[map[sid]] != null) out[map[sid]]++; else out.missing++;
    });
    out.byDate[c.date] = (out.byDate[c.date] || 0) + 1;
  });
  return out;
}

function trCsvText(rows) {
  return "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");

function openTrSubjectSheet(id) {
  var d = id ? trSubjectById(id) : null;
  var isNew = !d;
  var base = d || { name: "", note: "", active: true };
  var nT = d ? TR.teachers.filter(function (t) { return (t.subjectIds || []).indexOf(id) >= 0; }).length : 0;
  var nC = d ? TR.courses.filter(function (c) { return c.subjectId === id; }).length : 0;

  var html = '<div class="grab"></div><div class="sh-hd"><h3>' + (isNew ? "新增科目" : "编辑科目") +
    '</h3><button class="x" data-close>✕</button></div><div class="sh-bd">';
  html += '<div class="field"><label>科目名称 *</label><input type="text" id="trSubName" value="' + esc(base.name) +
    '" placeholder="如 数学 / 奥数 / 英语"></div>';
  html += '<div class="field"><label>备注</label><input type="text" id="trSubNote" value="' + esc(base.note || "") +
    '" placeholder="如 五年级培优"></div>';
  if (!isNew) {

              toast(err && err.message ? err.message : "删除失败");

      });
    }
  });
}

/* 培训档案编辑弹层（老师 / 学生共用一套） */
function openTrSheet(kind, id) {
  var isT = kind === "teacher";

  var isNew = !d;
  var base = d || (isT
    ? { name: "", subject: "", subjectIds: [], contact: "", note: "", active: true }
    : { name: "", gradeClass: "", contact: "", note: "", active: true });

  var html = '<div class="grab"></div><div class="sh-hd"><h3>' +
    (isNew ? (isT ? "新增培训老师" : "新增培训学生") : (isT ? "编辑培训老师" : "编辑培训学生")) +
    '</h3><button class="x" data-close>✕</button></div><div class="sh-bd">';
  html += '<div class="field"><label>姓名 *</label><input type="text" id="trName" value="' + esc(base.name) +
    '" placeholder="' + (isT ? "如 王老师" : "如 李小明") + '"></div>';
  if (isT) {
    /* v1.5：科目改为从科目档案多选；停用的历史科目仍可见并标明 */

    }
    subsAll.forEach(function (s) {
      var on = picked0.indexOf(s.id) >= 0;
      html += '<div class="trpick' + (on ? " sel" : "") + '" data-subid="' + esc(s.id) + '">' +
        '<span class="tick">✓</span><div class="who"><div class="nm">' + esc(s.name) +
        (s.active === false ? '<span class="pill off">已停用</span>' : "") + "</div></div></div>";
    });
    html += "</div>";
  } else {
    html += '<div class="field"><label>年级 / 班级</label><input type="text" id="trGrade" value="' + esc(base.gradeClass || "") +
      '" placeholder="如 五年级2班"></div>';
  }
  html += '<div class="field"><label>联系方式（可选）</label><input type="text" id="trContact" value="' + esc(base.contact || "") +
    '" placeholder="手机 / 微信"></div>';
  html += '<div class="field"><label>备注</label><input type="text" id="trNote" value="' + esc(base.note || "") +
    '" placeholder="如 周三晚排课"></div>';
  html += "</div>";
  html += '<div class="sh-ft">';
  html += '<button class="btn primary" id="trSave">保存</button>';
  if (!isNew) html += '<button class="btn" id="trToggle">' + (base.active === false ? "启用" : "停用") + "</button>";
  html += "</div>";
  html += '<div style="height:8px"></div>';

  openSheet(html, {
    onMount: function (sh) {
      sh.querySelector("[data-close]").addEventListener("click", closeSheet);
      if (isT) {
        sh.querySelectorAll("#trSubPickList .trpick").forEach(function (row) {
          row.addEventListener("click", function () { row.classList.toggle("sel"); });
        });
      }
      sh.querySelector("#trSave").addEventListener("click", function () {
        var name = sh.querySelector("#trName").value.trim();
        if (!name) { toast("姓名必填"); sh.querySelector("#trName").focus(); return; }
        var payload = {
          name: name,
          contact: sh.querySelector("#trContact").value.trim(),
          note: sh.querySelector("#trNote").value.trim()
        };
        if (isT) {
          /* v1.5：老师科目来自科目档案多选；subject 文本同步为所选科目名（、连接），保持显示一致 */
          var picked = [];
          sh.querySelectorAll("#trSubPickList .trpick.sel").forEach(function (r) { picked.push(r.dataset.subid); });
          payload.subjectIds = picked;
          payload.subject = picked.map(function (sid) {
            var s = trSubjectById(sid); return s ? s.name : "";
          }).filter(Boolean).join("、");
        } else {
          payload.gradeClass = sh.querySelector("#trGrade").value.trim();
        }
        var p = isNew
          ? (isT ? TR_API.createTeacher(payload) : TR_API.createStudent(payload))
          : (isT ? TR_API.updateTeacher(id, payload) : TR_API.updateStudent(id, payload));
        p.then(function (rec) {
          closeSheet();
          toast((isNew ? "已添加 " : "已保存 ") + rec.name);
          renderTraining();
        }).catch(function (err) { toast(err && err.message ? err.message : "保存失败"); });
      });
      var tg = sh.querySelector("#trToggle");
      if (tg) tg.addEventListener("click", function () {
        var p = isT ? TR_API.setTeacherActive(id, base.active === false) : TR_API.setStudentActive(id, base.active === false);
        p.then(function (rec) {
          closeSheet();
          toast((rec.active === false ? "已停用 " : "已启用 ") + rec.name + (rec.active === false ? "（历史签到保留）" : ""));
          renderTraining();
        }).catch(function (err) { toast(err && err.message ? err.message : "操作失败"); });
      });
    }
  });
}

/* =====================================================================
   记录页
   ===================================================================== */
function allRecords() { return Array.from(S.records.values()); }

function dateList() {
  var map = new Map();
  allRecords().forEach(function (r) {
    if (!map.has(r.date)) map.set(r.date, { date: r.date, total: 0, slots: {} });
    var d = map.get(r.date);
    d.total++;
    d.slots[r.slot] = (d.slots[r.slot] || 0) + 1;
  });
  return Array.from(map.values()).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
}

function monthlyStats(month, onlyActive) {
  var rows = new Map();
  var pool = sortStudents(onlyActive ? activeStudents() : S.students);
  pool.forEach(function (s) {
    rows.set(s.id, { s: s, dao: 0, leave: 0, duty: 0, total: 0 });
  });
  allRecords().forEach(function (r) {
    if (monthOf(r.date) !== month) return;
    var row = rows.get(r.studentId);
    if (!row) return;
    if (row[r.status] != null) row[r.status]++;
    row.total++;
  });
  return Array.from(rows.values());
}

function renderRecords() {
  var view = $("#view");
  var html = "";

  html += '<div class="seg" id="recSeg">' +
    '<button data-seg="day" class="' + (S.recSeg === "day" ? "on" : "") + '">按日</button>' +
    '<button data-seg="stat" class="' + (S.recSeg === "stat" ? "on" : "") + '">月度统计</button>' +
    '<button data-seg="data" class="' + (S.recSeg === "data" ? "on" : "") + '">数据</button>' +
    "</div>";

  if (S.recSeg === "day") html += renderDaySeg();
  else if (S.recSeg === "stat") html += renderStatSeg();
  else html += renderDataSeg();

  view.innerHTML = html;

  view.querySelectorAll("#recSeg button").forEach(function (b) {
    b.addEventListener("click", function () { S.recSeg = b.dataset.seg; renderRecords(); });
  });

  /* --- 按日 --- */
  var dl = view.querySelector("#dateList");
  if (dl) {
    dl.querySelectorAll(".drow").forEach(function (row) {
      row.addEventListener("click", function () { openDaySheet(row.dataset.date); });
    });
  }
  var ps = view.querySelector("#stuPick");
  if (ps) {
    ps.addEventListener("input", function () { renderStuPick(ps.value); });
  }
  if (view.querySelector("#stuPickBox")) renderStuPick("");

  /* --- 统计 --- */
  var mi = view.querySelector("#monthInput");
  if (mi) mi.addEventListener("change", function () { S.statMonth = mi.value || monthOf(todayStr()); renderRecords(); });

  /* --- 数据 --- */
  bindDataActions(view);
}

function renderStuPick(q) {

  var hits = sortStudents(S.students).filter(function (s) {
    return String(s.name).indexOf(q) >= 0 || String(s.group || "").indexOf(q) >= 0;
  }).slice(0, 8);
  if (!hits.length) { box.innerHTML = '<div class="panel" style="color:var(--muted);font-size:13px">没找到匹配的学生</div>'; return; }
  var h = '<div class="panel" style="padding:2px 12px">';

      '<span class="ava" style="width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:' + colorFor(s.name) +
      ';color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;overflow:hidden">' +
      (av ? '<img src="' + esc(av) + '" style="width:100%;height:100%;object-fit:cover">' : esc(surname(s.name))) + "</span>" +
      '<div class="d1"><div class="t" style="font-size:14px">' + esc(s.name) + '</div><div class="s">' + esc(s.group || "未分组") + "</div></div>" +

/* 单人历史：最近 60 天 */
function openStudentHistory(sid) {
  var s = studentById(sid);
  if (!s) return;
  var from = addDays(todayStr(), -60);
  var rows = allRecords().filter(function (r) { return r.studentId === sid && r.date >= from; })
    .sort(function (a, b) { return a.date === b.date ? slotOrder(a.slot) - slotOrder(b.slot) : (a.date < b.date ? 1 : -1); });
  var cnt = { dao: 0, leave: 0, duty: 0 };
  rows.forEach(function (r) { if (cnt[r.status] != null) cnt[r.status]++; });

  var h = '<div class="grab"></div><div class="sh-hd"><h3>' + esc(s.name) +
    ' <span style="font-size:12px;font-weight:500;color:var(--muted-2)">最近 60 天 · ' + rows.length + ' 条</span></h3>' +
    '<button class="x" data-close>✕</button></div><div class="sh-bd">';
  h += '<div class="panel" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;padding:10px 6px">';
  STATUS.forEach(function (st) {
    h += '<div><div style="font-size:17px;font-weight:700;color:' + (st.ink || st.c) + '">' + cnt[st.k] + "</div>" +
      '<div style="font-size:10.5px;color:var(--muted-2);margin-top:2px">' + st.n + "</div></div>";
  });
  h += "</div>";
  if (!rows.length) {
    h += '<div class="empty" style="padding:30px 10px">最近 60 天还没有记录</div>';
  } else {
    h += '<div class="panel" style="margin-top:10px;padding:2px 12px">';
    rows.forEach(function (r) {
      h += '<div class="drow"><div class="d1"><div class="t" style="font-size:13.5px">' + dateLabel(r.date) +
        ' <span style="font-size:11px;color:var(--muted-2);font-weight:400">' + slotName(r.slot) + "</span></div>" +
        '<div class="s">记录于 ' + tsLabel(r.updatedAt) + "</div></div>" +
      '<span style="font-size:12px;font-weight:700;color:' + (ST[r.status].ink || ST[r.status].c) + '">' + ST[r.status].n + "</span></div>";
    });
    h += "</div>";
  }
  h += '</div><div style="height:10px"></div>';
  openSheet(h, {
    onMount: function (sh) { sh.querySelector("[data-close]").addEventListener("click", closeSheet); }
  });
}

    rs.forEach(function (r) { if (c[r.status] != null) c[r.status]++; });
    h += '<div class="sec" style="margin-top:4px"><h2>' + sl.n + " · " + rs.length + " 条</h2></div>";

      var g = cmpGroup(ca, cb);

    }).forEach(function (r) {
      var s = studentById(r.studentId);

        esc(s ? (s.group || "未分组") : "") + "</span></div>" +
        '<div class="s">' + tsLabel(r.updatedAt) + "</div></div>" +
        '<span style="font-size:12px;font-weight:700;color:' + (ST[r.status].ink || ST[r.status].c) + '">' + ST[r.status].n + "</span></div>";
    });
    h += "</div>";
  });
  if (!rows.length) h += '<div class="empty">这天没有记录</div>';
  h += '</div><div style="height:10px"></div>';
  openSheet(h, {
    onMount: function (sh) { sh.querySelector("[data-close]").addEventListener("click", closeSheet); }
  });
}
