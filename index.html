<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>午托点名</title>
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="午托点名">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#F6F5F2;
  --card:#FFFFFF;
  --card-2:#FBFAF8;
  --line:#E7E4DE;
  --line-2:#EFEDE8;
  --text:#1F2320;
  --muted:#7C8179;
  --muted-2:#9AA098;
  --accent:#2E8B57;
  --shadow:0 1px 2px rgba(31,35,32,.05), 0 6px 16px rgba(31,35,32,.055);
  --shadow-s:0 1px 2px rgba(31,35,32,.06);
  --r:16px;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  /* 状态色 */
  --s-dao:#22C55E;
  --s-late:#F59E0B;
  --s-leave:#0EA5E9;
  --s-absent:#D9534F;
  --s-duty:#8B5CF6;
  --row-a:#FFE58F;
  --row-b:#BFE9FF;
  --dur:150ms;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181A;
    --card:#232528;
    --card-2:#1D1F22;
    --line:#33363A;
    --line-2:#2B2E31;
    --text:#ECEDEE;
    --muted:#9BA1A6;
    --muted-2:#7E848A;
    --accent:#3FA36B;
    --row-a:#3A3116;
    --row-b:#17303D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.35);
    --shadow-s:0 1px 2px rgba(0,0,0,.35);
  }
}

/* ============ 基础 ============ */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font:400 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;                 /* 只有 .main 内部滚动，避免整页横向漂移 */
  touch-action:manipulation;       /* 禁双击缩放 */
  -webkit-user-select:none; user-select:none;
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; touch-action:manipulation;}
input,textarea{font:inherit; color:inherit; -webkit-user-select:text; user-select:text;}
input[type=date]{-webkit-appearance:none; appearance:none;}

/* ============ 骨架 ============ */
.app{display:flex; flex-direction:column; height:100%; height:100dvh; overflow:hidden;}

/* 顶部 */
.hd{
  flex:0 0 auto; background:var(--bg);
  padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 12px) 0 calc(var(--safe-l) + 12px);
  border-bottom:1px solid var(--line-2);
}
.datebar{display:flex; align-items:center; gap:8px; height:44px;}
.dnav{
  width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center;
  border-radius:12px; color:var(--muted); font-size:20px; line-height:1;
}
.dnav:active{background:var(--line-2);}
.dlabel{
  flex:1 1 auto; min-width:0; height:44px; display:flex; align-items:center; justify-content:center; gap:6px;
  font-weight:600; font-size:17px; letter-spacing:.2px; border-radius:12px; position:relative;
}
.dlabel:active{background:var(--line-2);}
.dlabel .today{font-size:11px; font-weight:600; color:var(--accent); background:rgba(46,139,87,.1); padding:2px 6px; border-radius:6px;}
.dlabel input[type=date]{
  position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0;
}
/* 状态栏：固定在头部，学生列表滚动时始终可见 */
.brush{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:2px 0 8px;}
.brush button{
  height:46px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:15px; font-weight:600; color:var(--text);
  transition:background var(--dur) ease, border-color var(--dur) ease, transform 120ms ease;
}
.brush button:active{transform:scale(.97);}
.brush button i{width:9px; height:9px; border-radius:50%; display:block;}
.brush button.on{color:#101613; border-color:transparent;}
.brush button.on[data-k=dao]{background:var(--s-dao);}
.brush button.on[data-k=leave]{background:var(--s-leave);}
.brush button.on[data-k=duty]{background:var(--s-duty);}
.brush button.on i{background:#fff !important;}
/* 进度 */
.prog{display:flex; align-items:center; gap:10px; padding:0 2px 8px;}
.prog b{font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap;}
.prog .bar{flex:1 1 auto; height:4px; border-radius:2px; background:var(--line); overflow:hidden;}
.prog .bar i{display:block; height:100%; width:0%; background:var(--accent); border-radius:2px; transition:width var(--dur) ease;}

/* 主体滚动区 */
.main{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding:0 calc(var(--safe-r) + 12px) 12px calc(var(--safe-l) + 12px);
  overscroll-behavior:contain;
}
/* 工具条：搜索 + 筛选 */
.search{margin:10px 0 8px;}
.search input{
  width:100%; height:40px; border-radius:12px; border:1px solid var(--line);
  background:var(--card); padding:0 12px 0 34px; font-size:14px; outline:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='%239AA098' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M16.5 16.5 21 21'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:12px 50%;
}
.filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin:0 -12px; padding-left:12px; padding-right:12px;}
.filters::-webkit-scrollbar{display:none;}
.fchip{
  flex:0 0 auto; height:30px; padding:0 11px; border-radius:15px; background:var(--card);
  border:1px solid var(--line); font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:5px;
}
.fchip .cnt{font-size:11px; color:var(--muted-2); font-variant-numeric:tabular-nums;}
.fchip.on{background:var(--text); border-color:var(--text); color:var(--bg);}
.fchip.on .cnt{color:rgba(255,255,255,.72);}
@media (prefers-color-scheme: dark){ .fchip.on .cnt{color:rgba(0,0,0,.5);} }

/* 学生网格（v1.1：2 列大名片，点名页不再渲染头像圆） */
.grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
/* 行斑马纹：两列一行，单数行暖黄 / 双数行浅蓝 */
.grid .card:nth-child(4n+1), .grid .card:nth-child(4n+2){--row-bg:var(--row-a);}
.grid .card:nth-child(4n+3), .grid .card:nth-child(4n+4){--row-bg:var(--row-b);}
.card{
  position:relative; background:var(--row-bg, var(--card)); border-radius:var(--r); border:1px solid var(--line-2);
  padding:20px 10px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  text-align:center;
  box-shadow:var(--shadow-s); transition:transform 130ms ease, box-shadow 130ms ease, background 130ms ease, border-color 130ms ease;
  min-height:108px; overflow:hidden;
}
.card:active{transform:scale(.965);}
.card .dot{position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--line);}
/* 主显示名：>=22px / 700 / 单行不截断 */
.card .nm{
  font-size:22px; font-weight:700; line-height:1.2; letter-spacing:.3px; max-width:100%;
  white-space:nowrap;
}
/* 名字下方一行班级小字：12px / muted / 可截断不换行 */
.card .gp{
  font-size:12px; color:var(--muted); line-height:1.3; max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;
}
/* 选中态：边框色 + 淡底 + 左上角文字标签，三通道（不再依赖头像环） */
.card.st-dao{background:color-mix(in srgb, var(--s-dao) 45%, var(--row-bg)); border-color:var(--s-dao);}
.card.st-dao .dot{background:var(--s-dao);}
.card.st-leave{background:color-mix(in srgb, var(--s-leave) 45%, var(--row-bg)); border-color:var(--s-leave);}
.card.st-leave .dot{background:var(--s-leave);}
.card.st-duty{background:color-mix(in srgb, var(--s-duty) 45%, var(--row-bg)); border-color:var(--s-duty);}
.card.st-duty .dot{background:var(--s-duty);}
/* 状态文字徽标（不靠颜色单独区分） */
.card .tag{
  position:absolute; left:6px; top:6px; font-size:9px; font-weight:700; line-height:1;
  padding:3px 4px; border-radius:5px; color:#101613; display:none;
}
.card[data-st]:not([data-st=""]) .tag{display:block;}
.card[data-st=dao] .tag{background:var(--s-dao);}
.card[data-st=leave] .tag{background:var(--s-leave);}
.card[data-st=duty] .tag{background:var(--s-duty);}

/* 空状态 */
.empty{
  text-align:center; color:var(--muted); padding:56px 20px; font-size:14px; line-height:1.7;
}
.empty .big{font-size:15px; font-weight:600; color:var(--text); margin-bottom:6px;}
.empty button{
  margin-top:14px; height:44px; padding:0 20px; border-radius:12px; background:var(--text); color:var(--bg);
  font-weight:600; font-size:14px;
}

/* 底部 */
.bottom{flex:0 0 auto; background:var(--bg); border-top:1px solid var(--line-2);}
.stats{
  display:flex; align-items:center; gap:2px; padding:6px calc(var(--safe-r) + 8px) 6px calc(var(--safe-l) + 8px);
}
.st{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0;}
.st .n{font-size:14px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;}
.st .l{font-size:10px; color:var(--muted-2); line-height:1; display:flex; align-items:center; gap:3px; white-space:nowrap;}
.st .l i{width:6px; height:6px; border-radius:50%; display:block;}
.st.total .n{color:var(--text);}
.undo{
  flex:0 0 auto; height:36px; padding:0 11px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); font-size:12px; font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:4px;
  min-width:64px; justify-content:center;
}
.undo[disabled]{opacity:.4;}
.undo:active:not([disabled]){transform:scale(.96);}
.undo b{font-size:11px; color:var(--muted-2); font-weight:600;}

.tabbar{
  display:flex; align-items:stretch; height:52px;
  padding:0 calc(var(--safe-r) + 4px) calc(var(--safe-b) + 0px) calc(var(--safe-l) + 4px);
}
.tab{
  flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--muted-2); font-size:10px; font-weight:500; padding-top:4px;
}
.tab svg{width:22px; height:22px; display:block;}
.tab.on{color:var(--text);}
.tab.on .ico{transform:translateY(-1px);}
.tab .ico{transition:transform var(--dur) ease;}

/* 底部弹层 */
.mask{
  position:fixed; inset:0; background:rgba(20,22,20,.38); z-index:40;
  opacity:0; pointer-events:none; transition:opacity 170ms ease;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.mask.on{opacity:1; pointer-events:auto;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--card);
  border-radius:20px 20px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.18);
  transform:translateY(102%); transition:transform 180ms cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(var(--safe-b) + 10px);
  max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0);}
.sheet .grab{width:36px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 2px;}
.sheet .sh-hd{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 16px 6px;
}
.sheet .sh-hd h3{margin:0; font-size:16px; font-weight:600;}
.sheet .sh-hd .x{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--muted); font-size:18px;}
.sheet .sh-bd{padding:6px 16px 8px;}
.sheet .sh-ft{display:flex; gap:8px; padding:8px 16px 4px;}
.btn{
  flex:1 1 0; height:46px; border-radius:13px; background:var(--card-2); border:1px solid var(--line);
  font-size:15px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active{transform:scale(.985);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.danger{color:var(--s-absent); border-color:color-mix(in srgb, var(--s-absent) 34%, var(--line));}
.btn.ghost{background:none;}
.btn[disabled]{opacity:.45;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
.field input[type=text], .field input[type=number], .field textarea{
  width:100%; border-radius:11px; border:1px solid var(--line); background:var(--card-2);
  padding:11px 12px; font-size:15px; outline:none;
}
.field textarea{min-height:132px; resize:vertical; line-height:1.55; font-size:14px;}
.field input:focus, .field textarea:focus{border-color:var(--accent);}
.hint{font-size:12px; color:var(--muted-2); line-height:1.5; margin-top:6px;}

/* 状态选择器（长按弹层 / 编辑用） */
.stpick{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;}
.stpick button{
  height:56px; border-radius:13px; border:1px solid var(--line); background:var(--card-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  font-size:12px; font-weight:600; color:var(--text);
}
.stpick button i{width:9px; height:9px; border-radius:50%; display:block;}
.stpick button.on{color:#fff; border-color:transparent;}
.stpick button.on[data-k=dao]{background:var(--s-dao);}
.stpick button.on[data-k=leave]{background:var(--s-leave);}
.stpick button.on[data-k=duty]{background:var(--s-duty);}
.stpick button.on i{background:#fff !important;}

/* 名单行 */
.row{
  display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line-2);
  border-radius:14px; padding:9px 12px; margin-bottom:8px; box-shadow:var(--shadow-s);
}
.row.off{opacity:.55;}
.row .ava{width:38px; height:38px; border-radius:50%; background:#B9BEB7; color:#fff; display:grid; place-items:center; font-size:15px; font-weight:600; overflow:hidden; flex:0 0 38px;}
.row .ava img{width:100%; height:100%; object-fit:cover;}
.row .rowmain{flex:1 1 auto; min-width:0;}
.row .nm{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .sub{font-size:11.5px; color:var(--muted-2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .mini{
  height:32px; padding:0 9px; border-radius:9px; border:1px solid var(--line); font-size:12px; color:var(--muted);
  flex:0 0 auto; display:inline-flex; align-items:center;
}
.row .mini.warn{color:var(--s-absent);}

/* 通用块 */
.sec{margin:12px 0 6px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.sec h2{margin:0; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.3px;}
.sec .act{font-size:12px; color:var(--accent); font-weight:600;}
.panel{background:var(--card); border:1px solid var(--line-2); border-radius:var(--r); padding:12px; box-shadow:var(--shadow-s);}
.actions{display:flex; gap:8px; flex-wrap:wrap;}
.actions .btn{flex:1 1 40%; height:44px; font-size:13.5px;}
.seg{display:flex; gap:4px; background:var(--line-2); padding:3px; border-radius:11px; margin:10px 0 6px;}
.seg button{flex:1 1 0; height:32px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted);}
.seg button.on{background:var(--card); color:var(--text); box-shadow:var(--shadow-s);}
.drow{
  display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line-2);
}
.drow:last-child{border-bottom:0;}
.drow .d1{flex:1 1 auto; min-width:0;}
.drow .d1 .t{font-size:14.5px; font-weight:600;}
.drow .d1 .s{font-size:11.5px; color:var(--muted-2); margin-top:2px;}
.drow .arrow{color:var(--muted-2); font-size:16px;}
table.tb{width:100%; border-collapse:collapse; font-size:12px;}
table.tb th, table.tb td{padding:7px 4px; text-align:right; border-bottom:1px solid var(--line-2); white-space:nowrap;}
table.tb th:first-child, table.tb td:first-child{text-align:left; position:sticky; left:0; background:var(--card);}
table.tb th{color:var(--muted-2); font-weight:600; font-size:11px;}
table.tb td{font-variant-numeric:tabular-nums;}
.tbwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.monthbar{display:flex; align-items:center; gap:8px;}
.monthbar input[type=month]{flex:1 1 auto; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--card-2); padding:0 10px; font-size:14px;}
.kv{display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--line-2);}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600; font-variant-numeric:tabular-nums;}
.toast{
  position:fixed; left:50%; bottom:calc(var(--safe-b) + 118px); transform:translate(-50%, 10px);
  background:rgba(28,30,28,.92); color:#fff; font-size:13px; font-weight:500;
  padding:9px 15px; border-radius:11px; z-index:60; opacity:0; pointer-events:none;
  transition:opacity 150ms ease, transform 150ms ease; max-width:82vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%, 0);}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
</style>
</head>
<body>
<div class="app">
  <!-- ========== 顶部 ========== -->
  <header class="hd">
    <div class="datebar">
      <button class="dnav" id="prevDay" aria-label="前一天">‹</button>
      <div class="dlabel" id="dateLabel">
        <span id="dateText">—</span>
        <span class="today" id="todayTag" hidden>今天</span>
        <input type="date" id="datePick" aria-label="选择日期">
      </div>
      <button class="dnav" id="nextDay" aria-label="后一天">›</button>
    </div>
    <div class="brush" id="brushBar" aria-label="点名状态"></div>
    <div class="prog" id="progBar">
      <b id="progText">已点 0/0</b>
      <span class="bar"><i id="progFill"></i></span>
    </div>
  </header>

  <!-- ========== 主体 ========== -->
  <main class="main" id="main"><div id="view"></div></main>

  <!-- ========== 底部 ========== -->
  <div class="bottom">
    <div class="stats" id="statsBar"></div>
    <nav class="tabbar" id="tabBar">
      <button class="tab on" data-tab="roll">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span>
        点名
      </button>
      <button class="tab" data-tab="roster">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.5-5.4 5.5-5.4s5.5 2.1 5.5 5.4"/><path d="M17 5.2a3 3 0 0 1 0 5.6"/><path d="M18.5 20c0-2.3-.8-4-2-5"/></svg></span>
        名单
      </button>
      <button class="tab" data-tab="records">

<script>
"use strict";
/* =====================================================================
   午托点名 v1 —— 单文件 PWA
   存储：IndexedDB（学生 / 记录 / 头像），localStorage 只存界面偏好
   ===================================================================== */

/* ---------------------- 常量 ---------------------- */
var APP_VERSION = "1.2.1";
var DB_NAME = "wudian-db";
var DB_VER = 1;
var UNDO_LIMIT = 20;          /* 撤销栈深度 */
var LONGPRESS_MS = 500;       /* 长按阈值 */

/* v1.2：一天只点名一次，固定记在午餐时段 */
var SLOTS = [
  { k: "lunch", n: "午餐" }
];
var STATUS = [
  { k: "dao",    n: "到",   c: "#22C55E", ink: "#15803D" },
  { k: "leave",  n: "请假", c: "#0EA5E9", ink: "#0369A1" },
  { k: "duty",   n: "值日", c: "#8B5CF6", ink: "#6D28D9" }
];
var ST = {};
STATUS.forEach(function (s) { ST[s.k] = s; });

var WEEK = ["日", "一", "二", "三", "四", "五", "六"];

/* ---------------------- 小工具 ---------------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function el(tag, cls, html) {
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseYmd(s) {
  var p = String(s).split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function addDays(s, n) {
  var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d);
}
function todayStr() { return ymd(new Date()); }
function dateLabel(s) {
  var d = parseYmd(s);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WEEK[d.getDay()];
}
function monthOf(s) { return String(s).slice(0, 7); }
function tsLabel(ts) {
  var d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
    " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function uid() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}
/* 中文名字取首字（复姓简单处理：取第一个字） */
function surname(name) {
  var n = String(name || "").replace(/\s+/g, "");
  return n ? n[0] : "?";
}
/* 姓名归一化用于判重 */
function normName(name) { return String(name || "").replace(/\s+/g, "").trim(); }

var toastTimer = 0;
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("on"); }, 1600);
}

/* ---------------------- IndexedDB ---------------------- */
var dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("students")) db.createObjectStore("students", { keyPath: "id" });
      if (!db.objectStoreNames.contains("records"))  db.createObjectStore("records",  { keyPath: "key" });
      if (!db.objectStoreNames.contains("avatars"))  db.createObjectStore("avatars",  { keyPath: "id" });
      if (!db.objectStoreNames.contains("kv"))       db.createObjectStore("kv");
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
  return dbPromise;
}
function tx(store, mode) {
  return openDb().then(function (db) { return db.transaction(store, mode).objectStore(store); });
}
function idbAll(store) {
  return tx(store, "readonly").then(function (os) {
    return new Promise(function (res, rej) {
      var r = os.getAll();
      r.onsuccess = function () { res(r.result || []); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbPut(store, val, key) {
  return tx(store, "readwrite").then(function (os) {
    return new Promise(function (res, rej) {
      var r = key === undefined ? os.put(val) : os.put(val, key);
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbDel(store, key) {
  return tx(store, "readwrite").then(function (os) {
    return new Promise(function (res, rej) {
      var r = os.delete(key);
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  });
}
function idbClear(store) {
  return tx(store, "readwrite").then(function (os) {
    return new Promise(function (res, rej) {
      var r = os.clear();
      r.onsuccess = function () { res(); };
      r.onerror = function () { rej(r.error); };
    });
  });
}

/* ---------------------- 全局状态 ---------------------- */
var S = {
  tab: "roll",                 /* roll | roster | records */
  date: todayStr(),
  slot: "lunch",
  brush: "dao",                /* 当前状态笔 */
  search: "",
  filter: "all",               /* all | none | dao | leave | duty */
  students: [],                /* {id,name,group,seq,note,active,avatarId} */
  records: new Map(),          /* key "date|slot|sid" -> {key,date,slot,studentId,status,updatedAt} */
  avatarUrls: new Map(),       /* avatarId -> objectURL */
  undo: [],                    /* [{key,studentId,date,slot,prev}] */
  recSeg: "day",               /* 记录页分段：day | stat | data */
  statMonth: monthOf(todayStr()),
  recSearch: "",
  rosterSearch: "",
  purgedCount: 0
};

var PREF_KEY = "wudian.pref.v1";
function loadPref() {
  try {
    var p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
    if (p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date)) S.date = p.date;
    if (p.brush && STATUS.some(function (s) { return s.k === p.brush; })) S.brush = p.brush;
  } catch (e) { /* 偏好损坏就忽略 */ }
}
function savePref() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({ date: S.date, brush: S.brush }));
  } catch (e) { /* 隐私模式下可能失败，忽略 */ }
}

/* ---------------------- 数据读取 ---------------------- */
function recKey(date, slot, sid) { return date + "|" + slot + "|" + sid; }
function getRec(sid, date, slot) { return S.records.get(recKey(date || S.date, slot || S.slot, sid)) || null; }
function activeStudents() {
  return S.students.filter(function (s) { return s.active !== false; });
}
function studentById(id) {
  for (var i = 0; i < S.students.length; i++) if (S.students[i].id === id) return S.students[i];
  return null;
}
/* ---------- 分组文本 → 年级/班（v1.1 排序用） ----------
   认得这些写法：一 / 一1班 / 二3班 / 三年级 / 3年级 / 三年级2班 / 301班（＝3 年级 1 班）
   解析不出的一律 null → 排到最后 */
var CN_DIGIT = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10 };
function digitOf(ch) {
  if (ch == null || ch === "") return null;
  if (/^\d$/.test(ch)) return +ch;
  return CN_DIGIT[ch] || null;
}
function parseGroup(g) {
  var s = String(g == null ? "" : g).trim();
  if (!s) return null;
  /* 全角数字→半角，去空白，避免「三 2 班」「三年级２班」认不出 */
  s = s.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
       .replace(/\s+/g, "");
  var m, gd;
  /* 1) 三年级 / 3年级 / 三年级2班 */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*年级\s*(\d{1,2})?\s*班?/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: m[2] ? +m[2] : null, raw: s };
  }
  /* 2) 一1班 / 二3班 / 301班 */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*(\d{1,2})\s*班/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: +m[2], raw: s };
  }
  /* 2b) 一(1) / 一(1)班 / 一（1） */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*[（(]\s*(\d{1,2})\s*[)）]\s*班?/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: +m[2], raw: s };
  }
  /* 3) 一班 / 1班 */
  m = s.match(/^([一二三四五六七八九十]|\d)\s*班/);
  if (m) {
    gd = digitOf(m[1]);
    if (gd != null) return { grade: gd, cls: null, raw: s };
  }
  return null;
}

/* 旧规则：分组（数字优先按数值）→ 序号 → 姓名，仅供记录页/CSV 沿用 */
function cmpGroup(a, b) {
  var ga = String(a || "").trim(), gb = String(b || "").trim();
  if (!ga && gb) return 1;      /* 未分组排最后 */
  if (ga && !gb) return -1;
  var na = parseFloat(ga), nb = parseFloat(gb);
  var an = !isNaN(na), bn = !isNaN(nb);
  if (an && bn && na !== nb) return na - nb;
  if (an !== bn) return an ? -1 : 1;
  return ga.localeCompare(gb, "zh-Hans-CN");
}

/* 统一比较器（点名页 + 名单页共用）：
   年级升序 → 班级（班号优先，否则组名 localeCompare）→ 序号 → 姓名
   解析不出年级的分组一律排最后，组内沿用旧规则 */
function compareStudents(a, b) {
  var pa = parseGroup(a.group), pb = parseGroup(b.group);
  if (pa && pb) {
    if (pa.grade !== pb.grade) return pa.grade - pb.grade;
    if (pa.cls != null && pb.cls != null && pa.cls !== pb.cls) return pa.cls - pb.cls;
    var cn = String(a.group || "").localeCompare(String(b.group || ""), "zh-Hans-CN");
    if (cn) return cn;
  } else if (pa || pb) {
    return pa ? -1 : 1;
  } else {
    var og = cmpGroup(a.group, b.group);
    if (og) return og;
  }
  var sa = (a.seq == null ? 1e9 : a.seq), sb = (b.seq == null ? 1e9 : b.seq);
  if (sa !== sb) return sa - sb;
  return String(a.name).localeCompare(String(b.name), "zh-Hans-CN");
}
function sortStudents(list) {
  return list.slice().sort(compareStudents);
}
function slotOrder(k) {
  for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i].k === k) return i;
  return 9;
}
function slotName(k) {
  for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i].k === k) return SLOTS[i].n;
  return k;
}

/* ---------------------- 头像 ---------------------- */
function avatarUrl(avatarId) {
  if (!avatarId) return "";
  return S.avatarUrls.get(avatarId) || "";
}
function loadAvatars() {
  return idbAll("avatars").then(function (rows) {
    S.avatarUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    S.avatarUrls.clear();
    rows.forEach(function (r) {
      if (r && r.blob) S.avatarUrls.set(r.id, URL.createObjectURL(r.blob));
    });
  });
}
/* 压缩到 200×200 JPEG 0.75（居中裁方形） */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        var cv = document.createElement("canvas");
        cv.width = 200; cv.height = 200;
        var ctx = cv.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 200, 200);
        ctx.drawImage(img, sx, sy, side, side, 0, 0, 200, 200);
        cv.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (blob) resolve(blob); else reject(new Error("图片压缩失败"));
        }, "image/jpeg", 0.75);
      } catch (err) { URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
    img.src = url;
  });
}

/* ---------------------- 弹层 ---------------------- */
var sheetOpen = false;
function openSheet(html, opts) {
  var sh = $("#sheet"), mask = $("#mask");
  sh.innerHTML = html;
  sh.scrollTop = 0;
  mask.classList.add("on");
  sh.classList.add("on");
  sheetOpen = true;
  if (opts && opts.onMount) opts.onMount(sh);
}
function closeSheet() {
  $("#mask").classList.remove("on");
  $("#sheet").classList.remove("on");
  sheetOpen = false;
}
$("#mask").addEventListener("click", closeSheet);

/* =====================================================================
   点名页
   ===================================================================== */
function countByStatus(date, slot, list) {
  var out = { dao: 0, leave: 0, duty: 0, none: 0, total: list.length };
  list.forEach(function (s) {
    var r = getRec(s.id, date, slot);
    if (r && out[r.status] != null) out[r.status]++; else out.none++;
  });
  out.marked = out.total - out.none;
  return out;
}

function buildRollView() {
  var students = activeStudents();
  var wrap = document.createDocumentFragment();

  if (!S.students.length) {
    var e1 = el("div", "empty");
    e1.innerHTML = '<div class="big">还没有学生</div>名单里还没有人。<br>先去「名单」页添加，或批量粘贴导入。' +
      '<br><button id="goRoster">去名单页导入</button>';
    wrap.appendChild(e1);
    return { node: wrap, empty: "no-student" };
  }

  /* 搜索 */
  var se = el("div", "search");
  var input = el("input");
  input.type = "search";
  input.placeholder = "搜索姓名或分组";
  input.value = S.search;
  input.setAttribute("aria-label", "搜索学生");
  input.addEventListener("input", function () {
    S.search = input.value;
    renderGridOnly();     /* 只重绘网格，不打断输入焦点 */
  });
  se.appendChild(input);
  wrap.appendChild(se);

  /* 筛选 chips */
  var c = countByStatus(S.date, S.slot, students);
  var fw = el("div", "filters");
  var fdefs = [{ k: "all", n: "全部", c: c.total }, { k: "none", n: "未点", c: c.none }]
    .concat(STATUS.map(function (s) { return { k: s.k, n: s.n, c: c[s.k] }; }));
  fdefs.forEach(function (f) {
    var b = el("button", "fchip" + (S.filter === f.k ? " on" : ""));
    b.dataset.filter = f.k;
    b.innerHTML = f.n + '<span class="cnt">' + f.c + "</span>";
    b.addEventListener("click", function () { S.filter = f.k; render(); });
    fw.appendChild(b);
  });
  wrap.appendChild(fw);

  /* 网格容器 */
  var grid = el("div", "grid");
  grid.id = "grid";
  wrap.appendChild(grid);
  var emptyHint = el("div", "empty");
  emptyHint.id = "gridEmpty";
  emptyHint.hidden = true;
  wrap.appendChild(emptyHint);

  return { node: wrap };
}

function matchFilters(s) {
  if (S.search) {
    var q = S.search.trim().toLowerCase();
    if (q) {
      var hay = (String(s.name) + " " + String(s.group || "")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
  }
  if (S.filter === "all") return true;
  var r = getRec(s.id);
  var st = r ? r.status : "none";
  return st === S.filter;
}

/* 点名页主显示名（只影响显示，不改数据）
   ≤3 字 → 全名；4 字 → 后 2 字；≥5 字 → 后 3 字 */
function displayName(name) {
  var n = normName(name);
  var len = Array.from(n).length;
  if (len <= 3) return n;
  if (len === 4) return n.slice(n.length - 2);
  return n.slice(n.length - 3);
}

/* 卡片：无头像圆，只有 状态标签 + 状态点 + 大名字 + 班级小字 */
function cardHtml(s) {
  var r = getRec(s.id);
  var st = r ? r.status : "";
  return '<span class="tag">' + (st ? ((ST[st] || {}).n || "") : "") + "</span>" +
    '<span class="dot"></span>' +
    '<span class="nm">' + esc(displayName(s.name)) + "</span>" +
    '<span class="gp">' + esc(s.group || "\u00a0") + "</span>";
}
/* 名字 -> 稳定色（名单页/记录页无头像时的色块用） */
var PALETTE = ["#8E9BA8", "#A8917C", "#7E9A8A", "#9A8AA8", "#A8957E", "#7F93A8", "#A88282"];
function colorFor(name) {
  var n = String(name || ""), h = 0;
  for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 997;
  return PALETTE[h % PALETTE.length];
}

function renderGridOnly() {
  var grid = $("#grid");
  if (!grid) return;
  var list = sortStudents(activeStudents()).filter(matchFilters);
  /* v1.2：未点名的始终在上，已点名的沉底；两组内部都保持年级升序 */
  list.sort(function (a, b) {
    var ma = getRec(a.id) ? 1 : 0, mb = getRec(b.id) ? 1 : 0;
    if (ma !== mb) return ma - mb;
    return compareStudents(a, b);
  });
  var frag = document.createDocumentFragment();
  list.forEach(function (s) {
    var b = el("button", "card");
    b.dataset.id = s.id;
    b.dataset.st = (getRec(s.id) || {}).status || "";
    b.innerHTML = cardHtml(s);
    b.className = "card " + (b.dataset.st ? "st-" + b.dataset.st : "st-none");
    frag.appendChild(b);
  });
  grid.innerHTML = "";
  grid.appendChild(frag);
  var eh = $("#gridEmpty");
  if (eh) {
    if (!list.length) {
      eh.hidden = false;
      eh.innerHTML = '<div class="big">没有符合条件的学生</div>换个关键词，或把筛选切回「全部」。';
    } else { eh.hidden = true; }
  }
  refreshRollChrome();
}

/* 进度 + 统计条 */
function refreshRollChrome() {
  var students = activeStudents();
  var c = countByStatus(S.date, S.slot, students);
  $("#progText").textContent = "已点 " + c.marked + "/" + c.total;
  $("#progFill").style.width = (c.total ? (c.marked / c.total * 100) : 0) + "%";

  var sb = $("#statsBar");
  var html = "";
  STATUS.forEach(function (s) {
    html += '<div class="st"><span class="n" style="color:' + (s.ink || s.c) + '">' + c[s.k] + "</span>" +
      '<span class="l"><i style="background:' + s.c + '"></i>' + s.n + "</span></div>";
  });
  html += '<div class="st total"><span class="n">' + c.none + "</span>" +
    '<span class="l"><i style="background:var(--line)"></i>未点</span></div>';
  sb.innerHTML = html + '<button class="undo" id="undoBtn"' + (S.undo.length ? "" : " disabled") + ">" +
    "↶ 撤销" + (S.undo.length ? "<b>" + S.undo.length + "</b>" : "") + "</button>";

  /* 筛选条计数跟随点名结果同步 */
  var fw = $(".filters");
  if (fw) {
    fw.querySelectorAll(".fchip").forEach(function (b) {
      var k = b.dataset.filter;
      var n = k === "all" ? c.total : (k === "none" ? c.none : c[k]);
      var cnt = b.querySelector(".cnt");
      if (cnt) cnt.textContent = n;
    });
  }
}

/* 应用一个状态（幂等） */
function applyStatus(sid, status) {
  var key = recKey(S.date, S.slot, sid);
  var cur = S.records.get(key) || null;
  if (cur && cur.status === status) {
    return Promise.resolve({ changed: false, reason: "same" });   /* 幂等：不重复写 */
  }
  var rec = {
    key: key, date: S.date, slot: S.slot, studentId: sid,
    status: status, updatedAt: Date.now()
  };
  return idbPut("records", rec).then(function () {
    S.records.set(key, rec);
    pushUndo({ key: key, studentId: sid, date: S.date, slot: S.slot, prev: cur ? cloneRec(cur) : null });
    renderGridOnly();     /* 重新排序：已点名的沉到底部 */
    return { changed: true };
  });
}
function cloneRec(r) {
  return { key: r.key, date: r.date, slot: r.slot, studentId: r.studentId, status: r.status, updatedAt: r.updatedAt };
}
function pushUndo(op) {
  S.undo.push(op);
  if (S.undo.length > UNDO_LIMIT) S.undo.shift();
}
/* 长按状态选择弹层 */
function openStudentSheet(sid) {
  var s = studentById(sid);
  if (!s) return;

    '<div class="sh-bd"><div class="stpick" id="stpick">';

    html += '<button data-k="' + st.k + '"' + (cur && cur.status === st.k ? ' class="on"' : "") + ">" +
      '<i style="background:' + st.c + '"></i>' + st.n + "</button>";
  });
  html += "</div></div>";
  html += '<div class="sh-ft"><button class="btn danger" id="clearRec">清除本次记录</button></div>';
  html += '<div style="height:6px"></div>';

        if (!b) return;
        applyStatus(sid, b.dataset.k).then(function (r) {
          closeSheet();
          if (!r.changed) toast("已是「" + ST[b.dataset.k].n + "」，未重复记录");
        });
      });
      sh.querySelector("#clearRec").addEventListener("click", function () {
        var key = recKey(S.date, S.slot, sid);
        var prev = S.records.get(key);
        if (!prev) { closeSheet(); toast("本次还没有记录"); return; }
        idbDel("records", key).then(function () {
          S.records.delete(key);
          pushUndo({ key: key, studentId: sid, date: S.date, slot: S.slot, prev: cloneRec(prev) });
          renderGridOnly(); closeSheet();
          toast("已清除 " + s.name + " 的本次记录");
        });
      });
    }
  });
}

/* 撤销 */
function undoOnce() {
  var op = S.undo.pop();
  if (!op) return Promise.resolve(false);
  var p;
  if (op.prev) {
    p = idbPut("records", op.prev).then(function () { S.records.set(op.key, op.prev); });
  } else {
    p = idbDel("records", op.key).then(function () { S.records.delete(op.key); });
  }
  return p.then(function () {
    /* 撤销的是别处的记录时，跳到那里让用户看见结果 */
    if (op.date !== S.date || op.slot !== S.slot) {
      S.date = op.date; S.slot = op.slot; savePref(); render();
    } else {
      renderGridOnly();
    }
    var stName = op.prev ? ST[op.prev.status].n : "未点";
    toast("已撤销，恢复为「" + stName + "」");
    return true;
  });
}

/* 网格交互：点击标记 / 长按弹出 */
var lpTimer = 0, lpFired = false, lpStart = null;

function bindGrid() {
  var grid = $("#grid");
  if (!grid) return;

  grid.addEventListener("pointerdown", function (ev) {
    var card = ev.target.closest(".card");
    if (!card) return;
    lpFired = false;
    lpStart = { x: ev.clientX, y: ev.clientY, id: card.dataset.id };
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function () {
      if (!lpStart) return;
      lpFired = true;
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
      openStudentSheet(lpStart.id);
      lpStart = null;
    }, LONGPRESS_MS);
  });

  grid.addEventListener("pointermove", function (ev) {
    if (!lpStart) return;
    if (Math.abs(ev.clientX - lpStart.x) > 10 || Math.abs(ev.clientY - lpStart.y) > 10) {
      clearTimeout(lpTimer); lpStart = null;      /* 手指划动 = 滚动，取消长按 */
    }
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) {
    grid.addEventListener(t, function () { clearTimeout(lpTimer); lpStart = null; });
  });

  grid.addEventListener("click", function (ev) {
    var card = ev.target.closest(".card");
    if (!card) return;
    if (lpFired) { lpFired = false; return; }     /* 长按已处理，抑制点击 */
    var sid = card.dataset.id;
    var cur = getRec(sid);
    if (cur && cur.status === S.brush) {
      /* 幂等：同状态不重复写记录，给一个轻提示 */
      toast("已是「" + ST[S.brush].n + "」，未重复记录");
      return;
    }
    applyStatus(sid, S.brush);
  });
}

    }

}

/* 批量导入 */
function parseImportText(text) {
  var lines = String(text).split(/\r?\n/);
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var name = "", group = "";
    if (/[,，\t]/.test(line)) {
      var p = line.split(/[,，\t]/);
      name = p[0].trim();
      group = (p[1] || "").trim();
    } else {
      name = line.replace(/\s+/g, " ").trim();
    }
    if (!name) continue;
    out.push({ name: name, group: group });
  }
  return out;
}

function openBulkSheet() {
  var html = '<div class="grab"></div><div class="sh-hd"><h3>批量导入</h3><button class="x" data-close>✕</button></div>' +
    '<div class="sh-bd"><div class="field"><label>粘贴名单，每行一个</label>' +
    '<textarea id="bulkTa" placeholder="李小明&#10;王小雨,A组&#10;张三,一班"></textarea>' +
    '<div class="hint">支持两种格式：<b>姓名</b> 或 <b>姓名,分组</b>。<br>空行自动跳过，重名（与现有名单或本次重复）自动跳过。</div></div>' +
    '<div class="panel" style="padding:10px 12px"><div class="kv"><span class="k">将导入</span><span class="v" id="bulkCount">0 条</span></div>' +
    '<div class="kv"><span class="k">重复跳过</span><span class="v" id="bulkDup">0 条</span></div></div></div>' +
    '<div class="sh-ft"><button class="btn" data-close>取消</button><button class="btn primary" id="bulkOk" disabled>导入</button></div>' +
    '<div style="height:8px"></div>';
  openSheet(html, {
    onMount: function (sh) {
      var ta = sh.querySelector("#bulkTa");
      var ok = sh.querySelector("#bulkOk");
      sh.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeSheet); });

      function calc() {
        var rows = parseImportText(ta.value);
        var exist = new Set(S.students.map(function (s) { return normName(s.name); }));
        var seen = new Set(), fresh = 0, dup = 0;
        rows.forEach(function (r) {
          var k = normName(r.name);
          if (exist.has(k) || seen.has(k)) { dup++; return; }
          seen.add(k); fresh++;
        });
        sh.querySelector("#bulkCount").textContent = fresh + " 条";
        sh.querySelector("#bulkDup").textContent = dup + " 条";
        ok.disabled = fresh === 0;
        return { rows: rows, seen: seen, fresh: fresh };
      }
      ta.addEventListener("input", calc);
      setTimeout(function () { ta.focus(); }, 220);

      ok.addEventListener("click", function () {
        var st = calc();
        if (!st.fresh) return;
        var exist = new Set(S.students.map(function (s) { return normName(s.name); }));
        var seqByGroup = {};
        S.students.forEach(function (s) {
          var g = s.group || "";
          if (s.seq && (!seqByGroup[g] || s.seq > seqByGroup[g])) seqByGroup[g] = s.seq;
        });
        var added = [];
        st.rows.forEach(function (r) {
          var k = normName(r.name);
          if (exist.has(k)) return;
          exist.add(k);
          var g = r.group || "";
          seqByGroup[g] = (seqByGroup[g] || 0) + 1;
          added.push({
            id: uid(), name: r.name, group: g, seq: seqByGroup[g],
            note: "", active: true, avatarId: null
          });
        });
        Promise.all(added.map(function (s) { return idbPut("students", s); })).then(function () {
          S.students = S.students.concat(added);
          closeSheet();
          toast("已导入 " + added.length + " 人");
          renderRoster();
        });
      });
    }
  });
}

/* =====================================================================
   记录页
   ===================================================================== */
function allRecords() { return Array.from(S.records.values()); }

function dateList() {
  var map = new Map();
  allRecords().forEach(function (r) {
    if (!map.has(r.date)) map.set(r.date, { date: r.date, total: 0, slots: {} });
    var d = map.get(r.date);
    d.total++;
    d.slots[r.slot] = (d.slots[r.slot] || 0) + 1;
  });
  return Array.from(map.values()).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
}

function monthlyStats(month, onlyActive) {
  var rows = new Map();
  var pool = sortStudents(onlyActive ? activeStudents() : S.students);
  pool.forEach(function (s) {
    rows.set(s.id, { s: s, dao: 0, leave: 0, duty: 0, total: 0 });
  });
  allRecords().forEach(function (r) {
    if (monthOf(r.date) !== month) return;
    var row = rows.get(r.studentId);
    if (!row) return;
    if (row[r.status] != null) row[r.status]++;
    row.total++;
  });
  return Array.from(rows.values());
}

/* =====================================================================
   导出 / 备份
   ===================================================================== */
function csvCell(v) {
  var s = String(v == null ? "" : v);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function recordsCsv() {
  var rows = [["日期", "时段", "序号", "姓名", "分组", "状态", "记录时间"]];
  var list = allRecords().filter(function (r) { return studentById(r.studentId); });
  list.sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    var so = slotOrder(a.slot) - slotOrder(b.slot);
    if (so) return so;
    var sa = studentById(a.studentId), sb = studentById(b.studentId);
    var g = cmpGroup(sa && sa.group, sb && sb.group);
    if (g) return g;
    return ((sa && sa.seq) || 1e9) - ((sb && sb.seq) || 1e9);
  });
  list.forEach(function (r) {
    var s = studentById(r.studentId);
    rows.push([r.date, slotName(r.slot), s.seq == null ? "" : s.seq, s.name, s.group || "",
      (ST[r.status] || {}).n || r.status, tsLabel(r.updatedAt)]);
  });
  return "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
}
function studentsCsv() {
  var rows = [["序号", "姓名", "分组", "备注", "状态"]];
  sortStudents(S.students).forEach(function (s) {
    rows.push([s.seq == null ? "" : s.seq, s.name, s.group || "", s.note || "",
      s.active === false ? "停用" : "在用"]);
  });
  return "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
}

function blobToDataUrl(blob) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () { res(String(fr.result)); };
    fr.onerror = function () { rej(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function dataUrlToBlob(dataUrl) {
  var p = String(dataUrl).split(",");
  var mime = (p[0].match(/:(.*?);/) || [])[1] || "image/jpeg";
  var bin = atob(p[1]);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

/* 全量备份：学生 + 头像 + 记录 + 设置 */
function exportBackup() {
  return idbAll("avatars").then(function (avs) {
    var pending = avs.map(function (a) {
      return blobToDataUrl(a.blob).then(function (d) { return { id: a.id, dataUrl: d }; });
    });
    return Promise.all(pending);
  }).then(function (avatars) {
    var obj = {
      app: "午托点名",
      version: APP_VERSION,
      exportedAt: tsLabel(Date.now()),
      students: S.students,
      records: allRecords(),
      avatars: avatars,
      settings: { pref: JSON.parse(localStorage.getItem(PREF_KEY) || "{}") }
    };
    return JSON.stringify(obj, null, 2);
  });
}

function restoreBackup(text) {
  var obj;
  try { obj = JSON.parse(text); } catch (e) { toast("备份文件解析失败"); return; }
  if (!obj || !Array.isArray(obj.students)) { toast("不是有效的备份文件"); return; }
  var nS = obj.students.length, nR = Array.isArray(obj.records) ? obj.records.length : 0;
  confirmSheet("恢复备份？",
    "将导入 <b>" + nS + "</b> 名学生、<b>" + nR + "</b> 条记录。<br>现有数据会被<b>全部覆盖</b>，操作不可撤销。",
    "覆盖并导入", function () {
      Promise.all([idbClear("students"), idbClear("records"), idbClear("avatars")]).then(function () {
        var jobs = [];
        obj.students.forEach(function (s) { jobs.push(idbPut("students", s)); });
        (obj.records || []).forEach(function (r) {
          if (r && r.key) jobs.push(idbPut("records", r));
        });
        (obj.avatars || []).forEach(function (a) {
          try { jobs.push(idbPut("avatars", { id: a.id, blob: dataUrlToBlob(a.dataUrl) })); } catch (e) {}
        });
        return Promise.all(jobs);
      }).then(function () {
        if (obj.settings && obj.settings.pref) {
          try { localStorage.setItem(PREF_KEY, JSON.stringify(obj.settings.pref)); } catch (e) {}
        }
        return boot(true);
      }).then(function () {
        toast("已恢复 " + nS + " 名学生、" + nR + " 条记录");
        render();
      }).catch(function (err) { toast("恢复失败：" + (err && err.message ? err.message : err)); });
    }, true);
}

function downloadFile(name, text, mime) {
  var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1500);
}

/* =====================================================================
   顶部（日期 / 时段）与标签切换
   ===================================================================== */
function renderHeader() {
  $("#dateText").textContent = dateLabel(S.date);
  $("#todayTag").hidden = (S.date !== todayStr());
  $("#datePick").value = S.date;
  /* 状态栏与进度条只属于点名页；状态栏在头部，列表滚动时不动 */
  $("#brushBar").style.display = (S.tab === "roll") ? "" : "none";
  $("#progBar").style.display = (S.tab === "roll") ? "" : "none";
  renderBrush();
}

function renderBrush() {
  var bar = $("#brushBar");
  if (!bar) return;
  bar.innerHTML = "";
  STATUS.forEach(function (s) {
    var b = el("button");
    b.dataset.k = s.k;
    if (S.brush === s.k) b.className = "on";
    b.innerHTML = '<i style="background:' + s.c + '"></i>' + s.n;
    b.addEventListener("click", function () {
      S.brush = s.k; savePref(); renderBrush();
    });
    bar.appendChild(b);
  });
}

function render() {
  renderHeader();
  if (S.tab === "roll") renderRoll();
  else if (S.tab === "roster") renderRoster();
  else renderRecords();
  $("#tabBar").querySelectorAll(".tab").forEach(function (b) {
    b.classList.toggle("on", b.dataset.tab === S.tab);
  });
  document.getElementById("main").scrollTop = 0;
}

function switchTab(t) {
  if (S.tab === t) return;
  S.tab = t;
  render();
}

/* 事件绑定（一次性） */
function bindChrome() {
  $("#prevDay").addEventListener("click", function () {
    S.date = addDays(S.date, -1); savePref(); render();
  });
  $("#nextDay").addEventListener("click", function () {
    S.date = addDays(S.date, 1); savePref(); render();
  });
  $("#datePick").addEventListener("change", function (e) {
    if (e.target.value) { S.date = e.target.value; savePref(); render(); }
  });
  /* 点日期文字唤出日期选择器 */
  $("#dateLabel").addEventListener("click", function (e) {
    if (e.target.id === "datePick") return;
    var p = $("#datePick");
    if (typeof p.showPicker === "function") { try { p.showPicker(); return; } catch (err) {} }
    p.focus();
  });
  $("#tabBar").addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (!b) return;
    switchTab(b.dataset.tab);
  });
  /* 统计条上的撤销（委托，因为统计条会重绘） */
  $("#statsBar").addEventListener("click", function (e) {
    if (e.target.closest("#undoBtn")) undoOnce();
  });
  /* 键盘快捷键（桌面自测方便）：← → 切日，1-3 换笔，Ctrl+Z 撤销 */
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") { S.date = addDays(S.date, -1); savePref(); render(); }
    else if (e.key === "ArrowRight") { S.date = addDays(S.date, 1); savePref(); render(); }
    else if (e.key === "z" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undoOnce(); }
    else if (/^[1-3]$/.test(e.key) && S.tab === "roll") {
      S.brush = STATUS[+e.key - 1].k; savePref(); renderBrush();
    }
  });
  /* 阻止 iOS 上长按弹出系统菜单 */
  document.addEventListener("contextmenu", function (e) {
    if (e.target.closest(".card")) e.preventDefault();
  });
}

/* =====================================================================
   启动
   ===================================================================== */
function boot(skipPref) {
  if (!skipPref) loadPref();
  return Promise.all([idbAll("students"), idbAll("records")]).then(function (res) {
    S.students = res[0] || [];
    S.records = new Map();
    (res[1] || []).forEach(function (r) {
      if (r && r.key) S.records.set(r.key, r);
    });
    S.slot = "lunch";
    /* v1.2 一次性清理：迟到 / 未到 / 午休旧记录（按老蔡 2026-10-22 确认的 B 方案） */
    var stale = [];
    S.records.forEach(function (r, k) {
      if (!ST[r.status] || r.slot !== "lunch") stale.push(k);
    });
    stale.forEach(function (k) { S.records.delete(k); });
    S.purgedCount = stale.length;
    return Promise.all(stale.map(function (k) { return idbDel("records", k); })).then(loadAvatars);
  });
}

function registerSw() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return;   /* file:// 不支持 SW */
  var doReg = function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      /* 注册失败不阻塞使用，仅记录 */
      console.warn("Service Worker 注册失败：", err && err.message);
    });
  };
  /* boot 可能晚于 load 事件完成，错过 load 就立即注册 */
  if (document.readyState === "complete") doReg();
  else window.addEventListener("load", doReg);
}

/* 测试钩子：仅供自测脚本读取真实内部数据（不影响业务逻辑） */
window.__test = {
  state: S,
  recordsCsv: recordsCsv,
  studentsCsv: studentsCsv,
  countNow: function () { return countByStatus(S.date, S.slot, activeStudents()); },
  displayName: displayName,
  parseGroup: parseGroup,
  sortStudents: sortStudents,
  appVersion: APP_VERSION
};

boot().then(function () {
  bindChrome();
  render();
  registerSw();
  if (S.purgedCount) toast("已清理 " + S.purgedCount + " 条旧记录（迟到 / 未到 / 午休）");
  window.__ready = true;
}).catch(function (err) {
  document.getElementById("view").innerHTML =
    '<div class="empty"><div class="big">数据打开失败</div>' + esc(err && err.message ? err.message : err) +
    "<br>如果是隐私浏览模式，请换普通模式再试。</div>";
  console.error(err);
});
</script>
</body>
</html>
