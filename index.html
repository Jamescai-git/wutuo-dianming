/* =====================================================================
   导出 / 备份
   ===================================================================== */
function csvCell(v) {
  var s = String(v == null ? "" : v);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function recordsCsv() {
  var rows = [["日期", "时段", "序号", "姓名", "分组", "状态", "记录时间"]];
  var list = allRecords().filter(function (r) { return studentById(r.studentId); });
  list.sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    var so = slotOrder(a.slot) - slotOrder(b.slot);
    if (so) return so;
    var sa = studentById(a.studentId), sb = studentById(b.studentId);
    var g = cmpGroup(sa && sa.group, sb && sb.group);
    if (g) return g;
    return ((sa && sa.seq) || 1e9) - ((sb && sb.seq) || 1e9);
  });
  list.forEach(function (r) {
    var s = studentById(r.studentId);
    rows.push([r.date, slotName(r.slot), s.seq == null ? "" : s.seq, s.name, s.group || "",
      (ST[r.status] || {}).n || r.status, tsLabel(r.updatedAt)]);
  });
  return "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
}
function studentsCsv() {
  var rows = [["序号", "姓名", "分组", "备注", "状态"]];
  sortStudents(S.students).forEach(function (s) {
    rows.push([s.seq == null ? "" : s.seq, s.name, s.group || "", s.note || "",
      s.active === false ? "停用" : "在用"]);
  });
  return "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
}

function blobToDataUrl(blob) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () { res(String(fr.result)); };
    fr.onerror = function () { rej(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function dataUrlToBlob(dataUrl) {
  var p = String(dataUrl).split(",");
  var mime = (p[0].match(/:(.*?);/) || [])[1] || "image/jpeg";
  var bin = atob(p[1]);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

/* 全量备份：午托（学生 + 头像 + 记录 + 设置）＋ 培训（科目 / 老师 / 学生 / 课程 / 签到明细） */
function exportBackup() {
  return idbAll("avatars").then(function (avs) {
    var pending = avs.map(function (a) {
      return blobToDataUrl(a.blob).then(function (d) { return { id: a.id, dataUrl: d }; });
    });
    return Promise.all(pending);
  }).then(function (avatars) {
    var snap = trSnapshot();
    var obj = {
      app: "午托点名",
      version: APP_VERSION,
      exportedAt: tsLabel(Date.now()),
      students: S.students,
      records: allRecords(),
      avatars: avatars,
      settings: { pref: JSON.parse(localStorage.getItem(PREF_KEY) || "{}") },
      training: {
        schema: TR_SCHEMA,
        subjects: snap.subjects,
        teachers: snap.teachers,
        students: snap.students,
        courses: snap.courses,
        attendance: snap.attendance
      }
    };
    return JSON.stringify(obj, null, 2);
  });
}

function restoreBackup(text) {
  var obj;
  try { obj = JSON.parse(text); } catch (e) { toast("备份文件解析失败"); return; }
  if (!obj || (!Array.isArray(obj.students) && !obj.training)) { toast("不是有效的备份文件"); return; }

  var hasWudian = Array.isArray(obj.students);
  var nS = hasWudian ? obj.students.length : 0;
  var nR = Array.isArray(obj.records) ? obj.records.length : 0;
  var tr = (obj.training && typeof obj.training === "object") ? obj.training : null;
  var trT = tr && Array.isArray(tr.teachers) ? tr.teachers.length : 0;
  var trS = tr && Array.isArray(tr.students) ? tr.students.length : 0;
  var trC = tr && Array.isArray(tr.courses) ? tr.courses.length : 0;
  var trA = tr && Array.isArray(tr.attendance) ? tr.attendance.length : 0;

  var detail = "";
  if (hasWudian) {
    detail += "午托：<b>" + nS + "</b> 名学生、<b>" + nR + "</b> 条记录 —— 现有午托数据会被<b>全部覆盖</b>。<br>";
  } else {
    detail += "该备份<b>不含午托学生</b>，午托数据保持不变。<br>";
  }
  if (tr) {
    detail += "培训：<b>" + trT + "</b> 位老师、<b>" + trS + "</b> 名学生、<b>" + trC + "</b> 节课、<b>" + trA +
      "</b> 条签到明细 —— 现有培训数据会被<b>全部覆盖</b>。<br>";
  } else {
    detail += "这是旧版备份（不含培训数据），恢复后<b>培训档案保持不变</b>。<br>";
  }
  detail += "操作不可撤销，建议先导出一份当前备份。";

  confirmSheet("恢复备份？", detail, "覆盖并导入", function () {
    var chain = Promise.resolve();
    if (hasWudian) {
      chain = Promise.all([idbClear("students"), idbClear("records"), idbClear("avatars")]).then(function () {
        var jobs = [];
        obj.students.forEach(function (s) { jobs.push(idbPut("students", s)); });
        (obj.records || []).forEach(function (r) {
          if (r && r.key) jobs.push(idbPut("records", r));
        });
        (obj.avatars || []).forEach(function (a) {
          try { jobs.push(idbPut("avatars", { id: a.id, blob: dataUrlToBlob(a.dataUrl) })); } catch (e) {}
        });
        return Promise.all(jobs);
      }).then(function () {
        if (obj.settings && obj.settings.pref) {
          try { localStorage.setItem(PREF_KEY, JSON.stringify(obj.settings.pref)); } catch (e) {}
        }
        return boot(true);
      });
    }
    if (tr) {
      chain = chain.then(function () { return trRestoreSnapshot(tr); });
    }
    chain.then(function () {
      toast(hasWudian
        ? "已恢复 " + nS + " 名学生、" + nR + " 条记录" + (tr ? "；培训 " + trT + " 师 / " + trS + " 生 / " + trC + " 课" : "")
        : "已恢复培训数据：" + trT + " 位老师、" + trS + " 名学生、" + trC + " 节课");
      render();
    }).catch(function (err) { toast("恢复失败：" + (err && err.message ? err.message : err)); });
  }, true);
}

function downloadFile(name, text, mime) {
  var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1500);
}

   顶部（日期 / 时段）与标签切换

function renderHeader() {

  $("#modeSeg").querySelectorAll("button").forEach(function (b) {
    b.classList.toggle("on", b.dataset.mode === S.mode);
  });
  /* 状态笔与进度条只属于午托点名页；状态栏在头部，列表滚动时不动 */
  var isRollPage = (S.mode === "wudian" && S.tab === "roll");
  $("#brushBar").style.display = isRollPage ? "" : "none";
  $("#progBar").style.display = isRollPage ? "" : "none";
  /* 底部午托计数条只在午托模式出现；培训模式连内容一起清掉，DOM 里不留旧计数 */
  if (S.mode === "wudian") {
    $("#statsBar").style.display = "";
  } else {
    $("#statsBar").style.display = "none";
    $("#statsBar").innerHTML = "";
    $("#brushBar").innerHTML = "";
  }
  renderBrush();
}

function renderBrush() {
  var bar = $("#brushBar");
  if (!bar) return;
  bar.innerHTML = "";
  /* v1.5：状态笔只属于午托模式的点名页，其他模式不渲染 */
  if (!(S.mode === "wudian" && S.tab === "roll")) return;
  STATUS.forEach(function (s) {
    var b = el("button");
    b.dataset.k = s.k;
    if (S.brush === s.k) b.className = "on";
    b.innerHTML = '<i style="background:' + s.c + '"></i>' + s.n;
    b.addEventListener("click", function () {
      S.brush = s.k; savePref(); renderBrush();
    });
    bar.appendChild(b);
  });
}

function renderTabBar() {
  var bar = $("#tabBar");
  bar.innerHTML = (S.mode === "training") ? TRAIN_TABS_HTML : WUDIAN_TABS_HTML;

function render() {
  renderHeader();
  renderTabBar();
  if (S.mode === "training") renderTraining();
  else if (S.tab === "roll") renderRoll();
  else if (S.tab === "roster") renderRoster();
  else renderRecords();
  document.getElementById("main").scrollTop = 0;
}

function switchTab(t) {
  /* v1.5：底部页签按模式各记各的 */
  if (S.mode === "training") {
    if (TRAIN_TABS.indexOf(t) < 0 || S.trTab === t) return;
    S.trTab = t;
  } else {
    if (WUDIAN_TABS.indexOf(t) < 0 || S.tab === t) return;
    S.tab = t;
  }
  savePref();
  render();
}

function switchMode(m) {
  if (m !== "wudian" && m !== "training") return;
  if (S.mode === m) return;
  S.mode = m;
  savePref();
  render();
}

/* 事件绑定（一次性） */
function bindChrome() {
  $("#prevDay").addEventListener("click", function () {
    S.date = addDays(S.date, -1); savePref(); render();
  });
  $("#nextDay").addEventListener("click", function () {
    S.date = addDays(S.date, 1); savePref(); render();
  });
  $("#datePick").addEventListener("change", function (e) {
    if (e.target.value) { S.date = e.target.value; savePref(); render(); }
  });
  /* 点日期文字唤出日期选择器 */
  $("#dateLabel").addEventListener("click", function (e) {
    if (e.target.id === "datePick") return;
    var p = $("#datePick");
    if (typeof p.showPicker === "function") { try { p.showPicker(); return; } catch (err) {} }
    p.focus();
  });
  $("#tabBar").addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (!b) return;
    switchTab(b.dataset.tab);
  });
  /* v1.5：模式切换（委托，切换时底部导航整体重建） */
  $("#modeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-mode]");
    if (!b) return;
    switchMode(b.dataset.mode);
  });
  /* 统计条上的撤销（委托，因为统计条会重绘） */
  $("#statsBar").addEventListener("click", function (e) {
    if (e.target.closest("#undoBtn")) undoOnce();
  });
  /* 键盘快捷键（桌面自测方便）：← → 切日，1-3 换笔，Ctrl+Z 撤销 */
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") { S.date = addDays(S.date, -1); savePref(); render(); }
    else if (e.key === "ArrowRight") { S.date = addDays(S.date, 1); savePref(); render(); }
    else if (e.key === "z" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undoOnce(); }
    else if (/^[1-3]$/.test(e.key) && S.mode === "wudian" && S.tab === "roll") {
      S.brush = STATUS[+e.key - 1].k; savePref(); renderBrush();
    }
  });
  /* 阻止 iOS 上长按弹出系统菜单 */
  document.addEventListener("contextmenu", function (e) {
    if (e.target.closest(".card")) e.preventDefault();
  });
}

/* =====================================================================
   启动
   ===================================================================== */
function boot(skipPref) {
  if (!skipPref) loadPref();
  return Promise.all([idbAll("students"), idbAll("records")]).then(function (res) {
    S.students = res[0] || [];
    S.records = new Map();
    (res[1] || []).forEach(function (r) {
      if (r && r.key) S.records.set(r.key, r);
    });
    S.slot = "lunch";
    /* v1.2 一次性清理：迟到 / 未到 / 午休旧记录（按老蔡 2026-10-22 确认的 B 方案） */
    var stale = [];
    S.records.forEach(function (r, k) {
      if (!ST[r.status] || r.slot !== "lunch") stale.push(k);
    });
    stale.forEach(function (k) { S.records.delete(k); });
    S.purgedCount = stale.length;
    return Promise.all(stale.map(function (k) { return idbDel("records", k); })).then(loadAvatars);
  }).then(function () {
    TR.loadPromise = null; TR.loaded = false;
    return loadTraining();          /* 培训四张表独立读取，失败不影响午托点名 */
  });
}

function registerSw() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return;   /* file:// 不支持 SW */
  var doReg = function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      /* 注册失败不阻塞使用，仅记录 */
      console.warn("Service Worker 注册失败：", err && err.message);
    });
  };
  /* boot 可能晚于 load 事件完成，错过 load 就立即注册 */
  if (document.readyState === "complete") doReg();
  else window.addEventListener("load", doReg);
}
